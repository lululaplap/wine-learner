<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apricity Wine Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-screen tool. Controls on top, the map fills the middle, the selected wine reads in a sheet (bottom on phones, right on desktop). */
:root{
  --bg:#f1f3ef; --surface:#fbfcfa; --ink:#17201b; --ink-2:#4c5851; --ink-3:#78837c; --line:#d7dcd4;
  --accent:#7a2748; --on-accent:#ffffff;
  --t-sparkling:#2a78d6; --t-white:#eda100; --t-red:#e34948; --t-sweet:#1baf7a;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --font-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131715; --surface:#1b201d; --ink:#edf0eb; --ink-2:#bac3bc; --ink-3:#8a948d; --line:#313a34;
    --accent:#e596b6; --on-accent:#2a0d19;
    --t-sparkling:#3987e5; --t-white:#c98500; --t-red:#e34948; --t-sweet:#199e70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1b201d; --ink:#edf0eb; --ink-2:#bac3bc; --ink-3:#8a948d; --line:#313a34;
  --accent:#e596b6; --on-accent:#2a0d19;
  --t-sparkling:#3987e5; --t-white:#c98500; --t-red:#e34948; --t-sweet:#199e70;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
.top{padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.titlerow{display:flex;align-items:center;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1;margin:0;letter-spacing:-.01em;white-space:nowrap}
.count{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.search{position:relative;flex:1;min-width:0;margin-left:auto;max-width:300px}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--bg);padding:0 14px;font-size:14px}
.results{position:absolute;z-index:30;top:40px;right:0;left:0;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;display:none;max-height:300px;overflow:auto}
.results.open{display:block}
.results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.results .sub{color:var(--ink-3);font-size:12.5px}
.results .none{padding:10px;color:var(--ink-3);font-size:13.5px}

.row{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.row::-webkit-scrollbar{display:none}
.rowlabel{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:16px;height:32px;padding:0 12px;white-space:nowrap;font-weight:500;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.key{display:flex;gap:4px}
.key button{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:14px;height:28px;padding:0 8px;white-space:nowrap;font-size:12.5px;color:var(--ink-2)}
.key button[aria-pressed="false"]{opacity:.38;text-decoration:line-through}
.key svg{flex:none}
.toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;padding-left:8px;border-left:1px solid var(--line)}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}

.stage{position:relative;min-height:0;overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.gcirc{fill:var(--surface);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;cursor:zoom-in}
.glabel{font-family:var(--font-display);font-weight:700;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;cursor:zoom-in}
.glabel .n{font-family:var(--font-body);font-weight:500;fill:var(--ink-3)}
.link{stroke:var(--ink-3);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.16;pointer-events:none}
.links.strong .link{opacity:.38}
.links.off .link{opacity:0}
.links.hassel .link{opacity:.04}
.links .link.on{stroke:var(--accent);stroke-width:2;opacity:.95}
.node{cursor:pointer}
.node .hit{fill:transparent}
.node .mark{stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node.t-sparkling .mark{fill:var(--t-sparkling)}
.node.t-white .mark,.node.t-orange .mark{fill:var(--t-white)}
.node.t-red .mark{fill:var(--t-red)}
.node.t-sweet .mark{fill:var(--t-sweet)}
.node.t-rose .mark{fill:var(--surface);stroke:var(--t-red);stroke-width:3}
.node .glassring{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node .nlabel{font-size:11px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:500}
.node.dim{opacity:.13}
.node.off{opacity:.05;pointer-events:none}
.node.sel .mark{stroke:var(--ink);stroke-width:3}
.node.sel .nlabel{font-weight:600}
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12.5px;line-height:1.3;max-width:240px;display:none}
.tip b{font-weight:600}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.zoomctl button.fit{font-size:11px;font-weight:600}
.legendnote{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--ink-3);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:3px 8px;border-radius:8px;display:flex;gap:10px;align-items:center;pointer-events:none}
.legendnote span{display:flex;gap:5px;align-items:center}

.panel{background:var(--surface);border-top:1px solid var(--line);max-height:46vh;overflow:auto;padding:12px 16px 16px;position:relative}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.15;margin:0 34px 2px 0;text-wrap:balance}
.panel .meta{color:var(--ink-2);font-size:13.5px;margin:0}
.panel .price{font-variant-numeric:tabular-nums;font-weight:600;margin:6px 0 0}
.panel .price small{font-weight:400;color:var(--ink-3)}
.panel .note{margin:8px 0 0;max-width:62ch}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 34px 8px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:2px 8px;color:var(--ink-2)}
.pill.warn{border-color:var(--accent);color:var(--accent)}
.close{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.sub{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.cmp button,.anchors button{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:44px}
.cmp button:hover,.anchors button:hover{border-color:var(--ink-3)}
.cmp .nm,.anchors .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.cmp .ds,.anchors .ds{color:var(--ink-3);font-size:12px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:14px;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.chips button b{color:var(--ink);font-weight:600}
.intro p{margin:0 0 8px;color:var(--ink-2);max-width:62ch}
.anchors{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.foot{margin-top:12px;font-size:12.5px;color:var(--ink-3)}
.foot a{color:var(--accent)}

@media (min-width:880px){
  .app{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:1 / -1}
  .panel{border-top:0;border-left:1px solid var(--line);max-height:none;padding:16px 18px 20px}
  .cmp,.anchors{grid-template-columns:1fr}
  .row{overflow:visible;flex-wrap:wrap}
}
@media (max-width:879px){
  .anchors{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .anchors::-webkit-scrollbar{display:none}
  .anchors button{flex:none;width:230px}
  .panel{max-height:44vh}
}
@media (max-width:520px){
  .count{display:none}
  h1{font-size:18px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titlerow">
      <h1>Apricity Wine Map</h1>
      <span class="count" id="count"></span>
      <div class="search">
        <input id="q" type="search" placeholder="Find a wine, grape or region" autocomplete="off" aria-label="Find a wine, grape or region">
        <div class="results" id="results" role="listbox"></div>
      </div>
    </div>
    <div class="row">
      <span class="rowlabel">Group by</span>
      <div class="seg" id="modes"></div>
    </div>
    <div class="row">
      <span class="rowlabel">Show</span>
      <div class="key" id="key"></div>
      <label class="toggle" for="linksToggle"><input type="checkbox" id="linksToggle" checked> Comparison lines</label>
    </div>
  </header>
  <main class="stage" id="stage">
    <svg id="map" role="img" aria-label="Network of the wine list. Each mark is a wine; lines join wines worth comparing."></svg>
    <div class="zoomctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" class="fit" aria-label="Show the whole map">All</button>
    </div>
    <div class="legendnote"><span>Bigger = pricier</span><span><svg width="16" height="16" viewBox="-8 -8 16 16"><circle r="3.5" fill="var(--ink-3)"/><circle r="6.5" fill="none" stroke="var(--ink)" stroke-width="1.5"/></svg>by the glass</span></div>
    <div class="tip" id="tip"></div>
  </main>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  if (mode.other){
    const rest = [];
    m.forEach((arr,k) => { if (arr.length > 1) list.push({name:k, members:arr}); else rest.push(arr[0]); });
    list.sort((a,b) => b.members.length - a.members.length || a.name.localeCompare(b.name));
    if (rest.length) list.push({name:mode.other, members:rest, other:true});
  } else {
    m.forEach((arr,k) => list.push({name:k, members:arr}));
    if (mode.order) list.sort((a,b) => mode.order.indexOf(a.name) - mode.order.indexOf(b.name));
    else list.sort((a,b) => b.members.length - a.members.length || a.name.localeCompare(b.name));
  }
  return list;
}
function layout(animate){
  const s = measure(); lastW = s.w;
  VW = Math.max(s.w, 820); VH = VW * Math.max(0.55, Math.min(1.5, s.h / s.w));
  const mode = MODES.find(m => m.id === state.mode);
  let base;
  if (mode.id === 'links'){
    groups = []; base = 9.5;
    wines.forEach(w => { w.g = null; w.r = base * w.sizeF; });
    sim.force('x', d3.forceX(VW/2).strength(0.045)).force('y', d3.forceY(VH/2).strength(0.045 * VW / VH))
       .force('link', d3.forceLink(links).distance(44).strength(0.4))
       .force('charge', d3.forceManyBody().strength(-150).distanceMax(340))
       .force('collide', d3.forceCollide(d => d.r + 4).iterations(2));
  } else {
    groups = computeGroups(mode);
    const h = d3.hierarchy({children: groups.map(g => ({g, value: g.members.length + 0.8}))}).sum(d => d.value || 0);
    d3.pack().size([VW, VH]).padding(Math.max(16, VW * 0.03))(h);
    h.children.forEach(c => { const g = c.data.g; g.x = c.x; g.y = c.y; g.r = c.r; });
    base = Math.min(15, 0.6 * d3.min(groups, g => g.r / Math.sqrt(g.members.length)));
    groups.forEach(g => g.members.forEach(w => { w.g = g; w.r = base * w.sizeF; }));
    sim.force('link', null).force('charge', null)
       .force('x', d3.forceX(d => d.g.x).strength(0.22)).force('y', d3.forceY(d => d.g.y).strength(0.22))
       .force('collide', d3.forceCollide(d => d.r + Math.max(1.5, base * 0.16)).strength(0.9).iterations(3));
  }
  wines.forEach(w => {
    if (w.x == null || !animate){
      const cx = w.g ? w.g.x : VW/2, cy = w.g ? w.g.y : VH/2, rr = w.g ? w.g.r * 0.6 : Math.min(VW,VH) * 0.3, a = Math.random() * 6.283, q = Math.sqrt(Math.random()) * rr;
      w.x = cx + Math.cos(a) * q; w.y = cy + Math.sin(a) * q; w.vx = 0; w.vy = 0;
    }
  });
  // marks sized to the new radius
  nodeSel.select('.mark').attr('d', d => d3.symbol().type(TYPES[d.type].shape).size(Math.PI * d.r * d.r * (d.type === 'rose' ? 0.7 : 1))());
  nodeSel.select('.hit').attr('r', d => d.r + 7);
  nodeSel.select('.glassring').attr('r', d => d.r + Math.max(2.5, d.r * 0.38));
  // group circles and labels
  gGroups.selectAll('circle').data(groups, g => g.name).join('circle').attr('class','gcirc')
    .attr('cx', g => g.x).attr('cy', g => g.y).attr('r', g => g.r)
    .on('click', (e,g) => { e.stopPropagation(); select(null); zoomToGroup(g); });
  const lab = gLabels.selectAll('text').data(groups, g => g.name).join('text').attr('class','glabel')
    .on('click', (e,g) => { e.stopPropagation(); zoomToGroup(g); });
  lab.html(g => esc(g.name) + ' <tspan class="n">' + g.members.length + '</tspan>');
  gLinks.classed('strong', mode.id === 'links');
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));

  sim.on('tick', null).on('end', null);
  if (animate && !reduced){
    sim.alpha(0.9).alphaDecay(0.045).on('tick', draw).on('end', () => { if (state.mode === 'links') fit(true); }).restart();
    if (state.mode !== 'links') fit(true);
  } else {
    sim.alpha(1).alphaDecay(0.03);
    for (let i = 0; i < 280; i++) sim.tick();
    draw(); fit(false);
  }
  onZoom();
}
function draw(){
  nodeSel.attr('transform', d => 'translate(' + d.x.toFixed(1) + ',' + d.y.toFixed(1) + ')');
  linkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
}
function bounds(){
  if (state.mode !== 'links') return [0, 0, VW, VH];
  const x0 = d3.min(wines, w => w.x - w.r), x1 = d3.max(wines, w => w.x + w.r), y0 = d3.min(wines, w => w.y - w.r), y1 = d3.max(wines, w => w.y + w.r);
  return [x0, y0, x1, y1];
}
function fitBox(b, animate, maxK){
  const s = measure(), pad = 18, w = b[2]-b[0], h = b[3]-b[1];
  const k = Math.min(maxK || 6, (s.w - pad*2) / w, (s.h - pad*2) / h);
  const t = d3.zoomIdentity.translate(s.w/2 - k*(b[0]+w/2), s.h/2 - k*(b[1]+h/2)).scale(k);
  (animate && !reduced ? svg.transition().duration(550) : svg).call(zoom.transform, t);
}
function fit(animate){ fitBox(bounds(), animate, 1.6); }
function zoomToGroup(g){ fitBox([g.x-g.r, g.y-g.r-g.r*0.12, g.x+g.r, g.y+g.r], true, 5); }
function centreOn(w){
  const set = [w, ...[...nbrs.get(w.id)].map(i => byId.get(i)).filter(x => !x.isOff)], pad = w.r * 3;
  fitBox([d3.min(set, d => d.x) - pad, d3.min(set, d => d.y) - pad, d3.max(set, d => d.x) + pad, d3.max(set, d => d.y) + pad * 1.5], true, 13 / w.r);
}
function onZoom(){
  const sel = state.sel, nb = sel ? nbrs.get(sel) : null;
  nodeSel.select('.nlabel')
    .style('font-size', (11 / K) + 'px').style('stroke-width', (3 / K) + 'px')
    .attr('y', d => d.r + 12 / K)
    .style('display', d => {
      if (d.isOff) return 'none';
      if (sel) return (d.id === sel || nb.has(d.id)) ? null : 'none';
      return (d.r * K >= 10 && !d.isDim) ? null : 'none';
    });
  const kept = [], vis = new Set();
  [...groups].sort((a,b) => b.members.length - a.members.length).forEach(g => {
    const w = (g.name.length + 3) * 7.4, cx = g.x * K, y = (g.y - g.r) * K - 5, box = [cx - w/2, y - 14, cx + w/2, y + 4];
    if (!kept.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])){ kept.push(box); vis.add(g.name); }
  });
  gLabels.selectAll('text')
    .style('font-size', (12.5 / K) + 'px').style('stroke-width', (3.5 / K) + 'px')
    .attr('x', g => g.x).attr('y', g => g.y - g.r - 5 / K)
    .style('display', g => vis.has(g.name) ? null : 'none');
}

/* ---------- selection, filters ---------- */
function refresh(){
  const sel = state.sel, nb = sel ? nbrs.get(sel) : null, q = state.query;
  wines.forEach(w => {
    w.isOff = state.hidden.has(w.type);
    w.isDim = !w.isOff && ((sel && w.id !== sel && !nb.has(w.id)) || (!sel && q && !w.hay.includes(q)));
  });
  nodeSel.classed('off', d => d.isOff).classed('dim', d => d.isDim).classed('sel', d => d.id === sel);
  gLinks.classed('off', !state.showLinks && !sel).classed('hassel', !!sel);
  linkSel.classed('on', d => sel && (d.source.id === sel || d.target.id === sel) && !d.source.isOff && !d.target.isOff);
  if (sel) nodeSel.filter(d => d.id === sel || nb.has(d.id)).raise();
  onZoom();
}
function select(id, move){
  state.sel = id; refresh(); renderPanel();
  if (id && move !== false) centreOn(byId.get(id));
  const p = document.getElementById('panel'); p.scrollTop = 0;
}

/* ---------- panel ---------- */
function glyph(type, size){
  const s = size || 16, r = s * 0.36;
  const path = d3.symbol().type(TYPES[type].shape).size(Math.PI * r * r * (type === 'rose' ? 0.7 : 1))();
  const col = type === 'sparkling' ? 'var(--t-sparkling)' : type === 'sweet' ? 'var(--t-sweet)' : (type === 'red' || type === 'rose') ? 'var(--t-red)' : 'var(--t-white)';
  const paint = type === 'rose' ? 'fill="var(--surface)" stroke="' + col + '" stroke-width="2.2"' : 'fill="' + col + '"';
  return '<svg width="' + s + '" height="' + s + '" viewBox="' + (-s/2) + ' ' + (-s/2) + ' ' + s + ' ' + s + '" aria-hidden="true"><path d="' + path + '" ' + paint + '/></svg>';
}
function priceText(w){
  const parts = [];
  if (w.price != null) parts.push('£' + w.price + ' <small>bottle</small>');
  if (w.glass != null) parts.push('£' + w.glass + ' <small>' + (w.glassNote ? esc(w.glassNote) : 'glass') + '</small>');
  return parts.join(' &nbsp;·&nbsp; ');
}
function wineButton(w){
  return '<button data-wine="' + w.id + '">' + glyph(w.type, 18) + '<span><span class="nm">' + esc(w.short) + '</span><br><span class="ds">' + esc(w.grape) + ' · ' + esc(w.region) + (w.price != null ? ' · £' + w.price : ' · £' + w.glass + ' glass') + '</span></span></button>';
}
function renderPanel(){
  const el = document.getElementById('panel'), w = state.sel ? byId.get(state.sel) : null;
  if (!w){
    const anchors = ['galerne','loiseau','pranzegg','fronsac','boutdzan'].map(id => wineButton(byId.get(id))).join('');
    el.innerHTML = '<div class="intro"><p><strong>Tap a wine</strong> to read its note and light up the wines to compare it with. Tap a group to zoom in.</p>'
      + '<div class="sub">Start with the anchors</div><div class="anchors">' + anchors + '</div>'
      + '<p class="foot">Notes describe what each producer, grape and region normally gives. Wines marked “Check” need confirming with your supplier. <a href="' + GUIDE_URL + '">Open the written guide</a></p></div>';
  } else {
    const cmp = [...nbrs.get(w.id)].map(id => byId.get(id)).sort((a,b) => (w.cmp.includes(b.id) - w.cmp.includes(a.id)) || (a.price||0) - (b.price||0));
    const pills = '<span class="pill">' + glyph(w.type, 14) + esc(w.section) + '</span>'
      + (w.glass != null ? '<span class="pill">By the glass</span>' : '')
      + (w.unique ? '<span class="pill">♢ Unique expression</span>' : '')
      + (w.check ? '<span class="pill warn">Check with supplier</span>' : '');
    const chip = (mode, label, val) => '<button data-group="' + mode + '" data-val="' + esc(val) + '">' + label + ': <b>' + esc(val) + '</b></button>';
    const multiProd = wines.filter(x => x.prodGroup === w.prodGroup).length > 1;
    el.innerHTML = '<button class="close" aria-label="Close">×</button><div class="pills">' + pills + '</div>'
      + '<h2>' + esc(w.name) + (w.vintage ? ' ' + esc(w.vintage) : '') + '</h2>'
      + '<p class="meta">' + esc(w.grapes || w.grape) + ' · ' + esc(w.region) + (w.region !== w.country ? ', ' + esc(w.country) : '') + '</p>'
      + '<p class="price">' + priceText(w) + '</p>'
      + '<p class="note">' + esc(w.note) + '</p>'
      + '<div class="sub">Compare with</div><div class="cmp">' + cmp.map(wineButton).join('') + '</div>'
      + '<div class="sub">See its group</div><div class="chips">' + chip('grape','Grape',w.grape) + chip('region','Region',w.region) + (multiProd ? chip('producer','Producer',w.prodGroup) : '') + chip('price','Price',band(w.price)) + '</div>';
  }
}
document.getElementById('panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('close')) return select(null);
  if (b.dataset.wine) return select(b.dataset.wine);
  if (b.dataset.group){
    const keep = state.sel; setMode(b.dataset.group);
    const w = byId.get(keep); if (w && w.g) setTimeout(() => zoomToGroup(w.g), reduced ? 0 : 650);
  }
});

/* ---------- controls ---------- */
function setMode(id){
  if (id === state.mode) return;
  state.mode = id;
  try { history.replaceState(null, '', '#' + id); } catch (err) { location.hash = id; }
  layout(true);
}
const modesEl = document.getElementById('modes');
modesEl.innerHTML = MODES.map(m => '<button data-mode="' + m.id + '" aria-pressed="false">' + m.label + '</button>').join('');
modesEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });
addEventListener('hashchange', () => { const h = fromHash(); if (h !== state.mode){ state.mode = h; layout(true); } });

const keyEl = document.getElementById('key');
keyEl.innerHTML = Object.entries(TYPES).map(([id,t]) => '<button data-type="' + id + '" aria-pressed="true">' + glyph(id, 16) + t.label + '</button>').join('');
keyEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = b.dataset.type; state.hidden.has(t) ? state.hidden.delete(t) : state.hidden.add(t);
  b.setAttribute('aria-pressed', String(!state.hidden.has(t))); refresh();
});
document.getElementById('linksToggle').addEventListener('change', e => { state.showLinks = e.target.checked; refresh(); });
document.getElementById('zin').addEventListener('click', () => svg.transition().duration(reduced ? 0 : 250).call(zoom.scaleBy, 1.6));
document.getElementById('zout').addEventListener('click', () => svg.transition().duration(reduced ? 0 : 250).call(zoom.scaleBy, 1/1.6));
document.getElementById('zfit').addEventListener('click', () => fit(true));

/* search */
const qEl = document.getElementById('q'), resEl = document.getElementById('results');
function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
qEl.addEventListener('input', () => {
  state.query = norm(qEl.value);
  if (state.sel){ state.sel = null; renderPanel(); }
  refresh();
  if (!state.query){ resEl.classList.remove('open'); return; }
  const hits = wines.filter(w => w.hay.includes(state.query));
  resEl.innerHTML = hits.length ? hits.slice(0, 8).map(w => '<button role="option" data-wine="' + w.id + '">' + glyph(w.type, 16) + '<span>' + esc(w.name) + '<br><span class="sub">' + esc(w.grape) + ' · ' + esc(w.region) + '</span></span></button>').join('')
      + (hits.length > 8 ? '<div class="none">' + (hits.length - 8) + ' more are highlighted on the map</div>' : '')
    : '<div class="none">No wine matches “' + esc(qEl.value) + '”. Try a grape or a region.</div>';
  resEl.classList.add('open');
});
resEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  resEl.classList.remove('open'); qEl.value = ''; state.query = ''; qEl.blur(); select(b.dataset.wine);
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) resEl.classList.remove('open'); });
qEl.addEventListener('keydown', e => { if (e.key === 'Enter'){ const b = resEl.querySelector('button'); if (b) b.click(); } if (e.key === 'Escape'){ qEl.value = ''; qEl.dispatchEvent(new Event('input')); } });

/* tooltip (mouse only) */
const tipEl = document.getElementById('tip');
function showTip(e, d){
  const r = document.getElementById('stage').getBoundingClientRect();
  tipEl.innerHTML = '<b>' + esc(d.name) + '</b><br>' + esc(d.grape) + ' · ' + esc(d.region) + (d.price != null ? ' · £' + d.price : '');
  tipEl.style.display = 'block';
  const x = Math.min(e.clientX - r.left + 12, r.width - tipEl.offsetWidth - 8), y = Math.max(8, e.clientY - r.top - tipEl.offsetHeight - 10);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip(){ tipEl.style.display = 'none'; }

/* ---------- go ---------- */
renderPanel();
requestAnimationFrame(() => { layout(false); refresh(); });
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { const s = measure(); if (Math.abs(s.w - lastW) > 40){ layout(false); refresh(); } }, 200); }).observe(document.getElementById('stage'));
</script>
</body>
</html>
