<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Apricity Wines</title>
<style>
/* Text contrast is at least 6.7:1 in both themes, the bar the menu site sets. Text is 16px or larger. */
:root{
  --bg:#f6f4ef; --surface:#fffefb; --ink:#191d1a; --ink-2:#353b37; --ink-3:#474e49; --line:#cfd3cc;
  --accent:#6b1d3c; --on-accent:#ffffff; --warn:#7a3b00; --ok:#1d5a33;
  --t-sparkling:#2a6fc4; --t-white:#d99400; --t-red:#d23c3b; --t-sweet:#15936a;
  --term:#0645ad;
  --sea:#dfe8ec; --land:#f3f1ea; --landline:#b9bfb8;
  --ok-bg:#e2f3df; --no-bg:#fbe5e3; --no:#8e1d1d;
  --font:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121513; --surface:#1a1e1b; --ink:#eef0ec; --ink-2:#cdd3ce; --ink-3:#b4bcb6; --line:#363f39;
    --accent:#f2b3cc; --on-accent:#2a0d19; --warn:#ffc58a; --ok:#9be0b3;
    --t-sparkling:#4a93ea; --t-white:#d79a1c; --t-red:#ea5a59; --t-sweet:#28b585;
    --term:#9ec5ff;
    --sea:#0d1418; --land:#262b27; --landline:#4a524c;
    --ok-bg:#132b1b; --no-bg:#361616; --no:#ffb3ad;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1a1e1b; --ink:#eef0ec; --ink-2:#cdd3ce; --ink-3:#b4bcb6; --line:#363f39;
  --accent:#f2b3cc; --on-accent:#2a0d19; --warn:#ffc58a; --ok:#9be0b3;
  --t-sparkling:#4a93ea; --t-white:#d79a1c; --t-red:#ea5a59; --t-sweet:#28b585;
  --term:#9ec5ff;
  --sea:#0d1418; --land:#262b27; --landline:#4a524c;
  --ok-bg:#132b1b; --no-bg:#361616; --no:#ffb3ad;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0}
code{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;max-width:1280px;margin:0 auto}
.brand{font-weight:700;font-size:20px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:22px;padding:2px;gap:2px;background:var(--bg)}
.seg button{border:0;background:transparent;border-radius:20px;min-height:44px;padding:0 16px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
nav#nav{display:flex;gap:2px}
nav#nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600;white-space:nowrap}
nav#nav a[aria-current="page"]{color:var(--ink);background:var(--bg);box-shadow:inset 0 -3px 0 var(--accent)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-left:auto;color:var(--ink-3)}
.asof{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink-2);white-space:nowrap}
.stale{color:var(--warn);font-weight:600}
.status .stale{flex-basis:100%;text-align:right}
@media (max-width:1200px) and (min-width:641px){
  .b-long{display:none}
  nav#nav a{padding:0 9px}
  .seg button{padding:0 12px}
  .asof .asof-label{display:none}
}
@media (max-width:640px){
  .top{padding:6px 12px}
  .toprow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand switch theme" "nav nav status";gap:6px 8px}
  .brand{grid-area:brand;font-size:18px} .b-long{display:none}
  #modeSwitch{grid-area:switch;justify-self:center}
  #modeSwitch button{padding:0 12px}
  #themeBtn{grid-area:theme}
  nav#nav{grid-area:nav;overflow-x:auto;scrollbar-width:none;min-width:0}
  nav#nav::-webkit-scrollbar{display:none}
  nav#nav a{padding:0 8px}
  .status{grid-area:status;margin-left:0;justify-content:flex-end}
  .asof .asof-label{display:none}
  .status .stale{grid-column:1 / -1}
}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:44px;padding:0 12px}

main{max-width:1280px;margin:0 auto;padding:16px}
.loading,.intro{color:var(--ink-2)}
.errorbox{max-width:640px;margin:40px auto;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.errorbox h1{font-size:24px;margin-bottom:8px}

/* ---------- choose a mode ---------- */
.choose{max-width:720px;margin:24px auto}
.choose h1{font-size:28px;margin-bottom:16px}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:120px}
.choice:hover{border-color:var(--ink-3)}
.c-title{font-size:24px;font-weight:700}
.c-sub{color:var(--ink-2)}

/* ---------- badges, chips, rows ---------- */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:2px 10px;color:var(--ink-2);white-space:nowrap}
.badge.estimate{border-color:var(--warn);color:var(--warn);border-style:dashed}
.badge.tasted{border-color:var(--ok);color:var(--ok)}
.badge.needs{border-color:var(--accent);color:var(--accent);border-width:2px}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.glyph{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip b{color:inherit}
.rows{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.winerow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"g m p" "g m b";align-items:center;column-gap:12px;min-height:56px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.winerow:hover{border-color:var(--ink-3)}
.winerow .glyph{grid-area:g}
.wr-main{grid-area:m;display:flex;flex-direction:column;min-width:0}
.wr-name{font-weight:600}
.wr-sub{color:var(--ink-3);font-size:16px}
.wr-price{grid-area:p;font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.wr-badges{grid-area:b;justify-self:end}
.wr-badges .badge{font-size:16px;padding:0 8px}
.listsec{margin-bottom:24px}
.listsearch{margin:0 0 12px}
.listsearch input{width:100%;max-width:520px;min-height:48px;border:1px solid var(--line);border-radius:24px;background:var(--surface);padding:0 18px;font-size:18px}
.found{display:flex;flex-direction:column;gap:2px}
.found .why{margin:0 0 4px 12px;color:var(--ink-2);font-size:16px}
.listsec h2,.checksec h2{font-size:21px;margin:0 0 10px}
.n{color:var(--ink-3);font-weight:500}

/* ---------- wine card ---------- */
.card{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px 24px}
.card .back{margin:0 0 10px}
.card h2{font-size:28px;text-wrap:balance}
.vintage{color:var(--ink-3);font-weight:500}
.card h3{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 6px}
.say{margin:6px 0 0;color:var(--ink-2)}
.meta{color:var(--ink-2);margin:6px 0 0}
.prices{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;margin:8px 0 0}
.unit{font-weight:500;color:var(--ink-3);font-size:16px}
.guestline{font-size:20px;margin:0;max-width:60ch}
.note{margin:0;max-width:62ch}
.tags{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-label{color:var(--ink-3);font-weight:600;margin-right:4px}
.tag{border:1px solid var(--line);border-radius:10px;padding:0 8px}
.scores{display:grid;gap:6px}
.score{display:grid;grid-template-columns:7.5em auto 1fr;gap:10px;align-items:center}
.sc-name{font-weight:600}
.dots{display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3)}
.dot.on{background:var(--ink)}
.sc-word{color:var(--ink-2)}
.cmp{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cmpbtn{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none}
.cmpbtn:hover{border-color:var(--ink-3)}
.cmpbtn > span{display:flex;flex-direction:column}
.nm{font-weight:600;line-height:1.25}
.ds{color:var(--ink-3);font-size:16px;line-height:1.3}
.checkq{border-left:4px solid var(--warn);padding-left:10px;margin:0}
/* ---------- tasting menu pairings ---------- */
.pairingsview{max-width:860px;margin:0 auto}
.pp-jump{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 18px;padding-bottom:2px}
.pp-jump::-webkit-scrollbar{display:none}
.pp-jump .chip{flex:none;text-decoration:none}
.pp-course{margin:0 0 26px;scroll-margin-top:calc(var(--top-h, 120px) + 8px)}
.pp-course h2{font-size:22px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.pp-dishes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.pp-dish{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pp-name{font-size:20px;margin:0 0 8px}
.pp-detail{display:block;font-size:16px;font-weight:500;color:var(--ink-2);margin-top:2px}
.pp-note{margin:0 0 8px;color:var(--ink-2)}
.pp-wine .winerow{background:var(--bg)}
.pp-or{margin:6px 0;color:var(--ink-3);font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.06em}
.pp-missing{color:var(--warn)}
.pairing{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 12px}
.pair-dish{margin:0 0 4px;font-size:18px}
.pair-choose{font-size:15px;color:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:0 6px}
.pair-detail{color:var(--ink-2)}
.pair-note{margin:0 0 6px;color:var(--ink-2)}
.script summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center}
.script p{margin:0 0 8px;max-width:62ch}
.source{margin:20px 0 0;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
.listline{margin:6px 0 0;color:var(--ink-3);font-size:16px}
body[data-mode="service"] .listline{display:none}

/* ---------- data check ---------- */
.checkview{max-width:960px;margin:0 auto}
.viewtitle{font-size:28px;margin-bottom:8px}
.summary{font-size:19px;margin:0 0 8px}
.sources{margin:0 0 20px;padding-left:20px;color:var(--ink-2)}
.checksec{margin:0 0 28px}
.checksec .intro{margin:0 0 10px}
.ok{color:var(--ok);font-weight:600;margin:0}
.checkrow{display:flex;flex-direction:column;gap:4px}
.checkrow .key{align-self:flex-start}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:4px 0}
.winelink{font-weight:600}

/* ---------- map ---------- */
body.fullmap main{max-width:none;padding:0}
.mapview{display:flex;flex-direction:column;height:calc(100dvh - var(--top-h, 120px))}
.mapbar{padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.mapbar .row{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none}
.mapbar .row::-webkit-scrollbar{display:none}
.rowlabel{font-size:16px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.mapbar .seg button{min-height:44px;padding:0 12px}
.key{display:flex;gap:4px}
.key button{display:flex;align-items:center;gap:6px;min-height:44px;border:1px solid transparent;background:transparent;border-radius:14px;padding:0 8px;white-space:nowrap;color:var(--ink-2)}
.key button[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.toggle{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--ink-2);white-space:nowrap;padding:0 8px;border-left:1px solid var(--line)}
.toggle input{accent-color:var(--accent);width:20px;height:20px;margin:0}
.search{position:relative;flex:1;min-width:220px;max-width:340px;margin-left:auto}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:22px;background:var(--bg);padding:0 16px}
.results{position:fixed;z-index:60;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px;display:none;max-height:340px;overflow:auto}
.results.open{display:block}
.results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;min-height:44px}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.results .sub{color:var(--ink-3);font-size:16px}
.results .none{padding:10px;color:var(--ink-2)}
.mapbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.stage{position:relative;min-height:0;overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.maploading{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--ink-2)}
.gcirc{fill:var(--surface);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;cursor:zoom-in}
.glabel{font-weight:700;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;cursor:zoom-in}
.glabel .n{font-weight:500;fill:var(--ink-3)}
.link{stroke:var(--ink-3);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.16;pointer-events:none}
.links.strong .link{opacity:.38}
.links.off .link{opacity:0}
.links.hassel .link{opacity:.04}
.links .link.on{stroke:var(--accent);stroke-width:2;opacity:.95}
.node{cursor:pointer}
.node .hit{fill:transparent}
.node .mark{stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node.t-sparkling .mark{fill:var(--t-sparkling)}
.node.t-white .mark,.node.t-orange .mark{fill:var(--t-white)}
.node.t-red .mark{fill:var(--t-red)}
.node.t-sweet .mark{fill:var(--t-sweet)}
.node.t-rose .mark{fill:var(--surface);stroke:var(--t-red);stroke-width:3}
.node .glassring{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node .nlabel{fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;pointer-events:none;font-weight:600}
.node.dim{opacity:.13}
.node.off{opacity:.05;pointer-events:none}
.node.sel .mark{stroke:var(--ink);stroke-width:3}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.zoomctl button.fit{font-size:16px;font-weight:600}
.legendnote{position:absolute;left:12px;bottom:10px;font-size:16px;color:var(--ink-2);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:3px 8px;border-radius:8px;display:flex;gap:12px;align-items:center;pointer-events:none}
.legendnote span{display:flex;gap:6px;align-items:center}
.mappanel{background:var(--surface);border-top:1px solid var(--line);max-height:44dvh;overflow:auto;padding:12px 16px 16px;position:relative}
.mappanel h2{font-size:22px;margin:0 44px 4px 0;text-wrap:balance}
.mappanel .badges{padding-right:48px}
.mappanel h3{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px}
.mappanel .note{margin:8px 0}
.mappanel .prices{font-size:18px}
.mappanel .intro p{margin:0 0 10px}
.mappanel .foot{color:var(--ink-2)}
.close{position:absolute;right:10px;top:8px;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);font-size:22px;line-height:1}
@media (min-width:900px){
  .mapbody{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}
  .mappanel{border-top:0;border-left:1px solid var(--line);max-height:none;padding:16px 18px 20px}
  .mappanel .cmp{grid-template-columns:1fr}
  .mapbar .row{flex-wrap:wrap;overflow:visible}
}
@media (max-width:899px){
  .mappanel{max-height:38dvh}
  .anchors{display:flex;overflow-x:auto}
  .anchors .cmpbtn{flex:none;width:240px}
}
@media (max-width:560px){
  .brand{font-size:18px}
  .rows{grid-template-columns:1fr}
  .card{padding:14px 16px 20px;border-radius:14px}
  .card h2{font-size:24px}
  .search{max-width:none;min-width:180px}
}
/* ---------- lesson path ---------- */
.namepick{max-width:560px;margin:24px auto}
.namepick h1{font-size:28px;margin-bottom:8px}
.namepick .names{margin:12px 0}
.namepick .choice{min-height:64px}
.nameform label{display:block;font-weight:600;margin:8px 0 6px}
.namerow{display:flex;gap:8px}
.namerow input{flex:1;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);font-size:18px}
.pathview{max-width:720px;margin:0 auto;overflow-x:clip;--wind:1}
@media (max-width:560px){.pathview{--wind:.45}}
.pathtop{margin-bottom:20px}
.hello{font-size:22px;font-weight:700;margin:0 0 12px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;min-height:44px;padding:0 6px}
.pathactions{display:flex;flex-wrap:wrap;gap:8px}
.btn.big{min-height:56px;font-size:18px;padding:0 22px;border-radius:16px}
.newlist{margin-top:18px;padding:14px;border:2px solid var(--accent);border-radius:16px;background:var(--surface)}
.newlist h2{font-size:20px}
.unit{margin:0 0 28px}
.unithead{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:start;background:var(--accent);color:var(--on-accent);border-radius:18px;padding:14px 16px}
.uh-n{margin:0;font-weight:600;opacity:.9}
.unithead h2{font-size:22px;margin:2px 0}
.uh-blurb{margin:0;font-size:16px;opacity:.95}
.uh-side{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;font-weight:600;white-space:nowrap}
.crown path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.crown.on path{fill:#f2c14e;stroke:#f2c14e}
.unithead .bar{grid-column:1 / -1}
.bar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .2s}
.unithead .bar{background:color-mix(in srgb,var(--on-accent) 30%,transparent)}
.unithead .bar span{background:var(--on-accent)}
.duebtn{grid-column:1 / -1;justify-self:start;color:var(--on-accent);border-color:color-mix(in srgb,var(--on-accent) 60%,transparent)}
.nodes{list-style:none;margin:44px 0 0;padding:0;display:flex;flex-direction:column;align-items:center;gap:22px}
/* .nodes > .node, not .node: the maps draw each wine as an svg <g class="node"> placed by its transform attribute, which a CSS transform would override */
.nodes > .node{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--off) * var(--wind)));max-width:min(260px,70vw)}
.nodebtn{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--surface);border:3px solid var(--line);
  color:var(--ink-2);font-size:24px;font-weight:700;text-decoration:none;box-shadow:0 5px 0 var(--line)}
.node.next .nodebtn{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);outline:4px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:4px}
.node.done .nodebtn{background:var(--ok);border-color:var(--ok);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.nodebtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.startbubble{position:absolute;top:-34px;background:var(--surface);color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:0 10px;font-weight:700}
.nodewines{margin-top:10px;text-align:center;color:var(--ink-2);font-size:16px;line-height:1.3}
.nodewines .glyph{vertical-align:-2px;margin-right:1px}
.pathfoot{margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.pathfoot p{margin:0}

/* ---------- lesson ---------- */
body:has(main[data-view="lesson"]) .top{position:static}
.lessonview{max-width:760px;margin:0 auto;padding-bottom:280px}
.lessontitle{margin:0 0 8px;color:var(--ink-2);font-weight:600}
.lessontop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.closebtn{display:grid;place-items:center;width:44px;height:44px;border-radius:22px;font-size:28px;color:var(--ink-2);text-decoration:none;flex:none}
.lessonbar{flex:1;height:16px;border-radius:8px}
.lessonbar span{border-radius:8px}
.qtype{display:inline-block;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.qprompt{font-size:26px;line-height:1.25;margin:0 0 20px;outline:none}
.opts{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:68px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);
  font-size:18px;font-weight:600;box-shadow:0 4px 0 var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.optkey{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);color:var(--ink-3);font-size:16px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-bg);box-shadow:0 4px 0 var(--no)}
.opt.faded{opacity:.55}
.opt:disabled{cursor:default}
.saycard{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);margin-bottom:18px}
.say-name{font-size:20px;font-weight:700;margin:0}
.say-meta{margin:4px 0 0;color:var(--ink-2)}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:50;border-top:2px solid;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:rise .18s ease-out}
.feedback.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.feedback.no{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.feedback.say{background:var(--surface);border-color:var(--accent);color:var(--ink)}
.fb-inner{max-width:760px;margin:0 auto}
.fb-head{font-size:24px;font-weight:800;margin:0 0 4px}
.fb-answer{margin:0 0 6px;font-size:18px}
.fb-guest{margin:6px 0;font-size:18px;color:var(--ink)}
.fb-cmp{margin:4px 0;color:var(--ink-2)}
.fb-est{margin:4px 0;color:var(--ink-2);font-size:16px}
.fb-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.feedback.ok .btn{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.feedback.no .btn{background:var(--no);border-color:var(--no);color:var(--surface)}
.feedback.say .btn.ghost{background:transparent;color:var(--ink)}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.lessonend{text-align:center;padding:30px 0}
.lessonend h1{font-size:32px;margin-bottom:10px}
.endscore{font-size:22px}

/* ---------- typed answers and matching ---------- */
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.typedrow{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:0 14px;box-shadow:0 4px 0 var(--line)}
.typedrow:focus-within{border-color:var(--accent)}
.typedrow.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.typedrow.wrong{border-color:var(--no);background:var(--no-bg);box-shadow:0 4px 0 var(--no)}
.pound{font-size:22px;font-weight:700;color:var(--ink-2)}
.typedinput{flex:1;min-width:0;min-height:60px;border:0;background:transparent;font-size:22px;font-weight:600;outline:none}
.typedhelp{color:var(--ink-2);margin:8px 0}
.suggest{list-style:none;margin:6px 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.sugg{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.sugg:hover{border-color:var(--accent)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mbtn{min-height:60px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;box-shadow:0 4px 0 var(--line);text-align:center}
.mbtn.sel{border-color:var(--term);background:color-mix(in srgb,var(--term) 12%,var(--surface));box-shadow:0 4px 0 var(--term)}
.mbtn.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);box-shadow:none;opacity:.75}
.mbtn.miss{border-color:var(--no);background:var(--no-bg);box-shadow:0 4px 0 var(--no)}
.matchgrid.terms .mbtn{font-size:16px;font-weight:500;text-align:left;line-height:1.3}
.matchgrid.terms .mcol:first-child .mbtn{font-weight:700;text-align:center}
.opt.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.opt.pick[aria-pressed="true"] .optkey{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opts.long .opt{font-size:17px;font-weight:500;line-height:1.35}

/* ---------- taste first ---------- */
.openline{margin:10px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.openstate{font-weight:600;color:var(--ink-3)}
.openstate.on{color:var(--ok)}
.openstate.on::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px}
.yourtaste{margin:0;border-left:4px solid var(--term);padding-left:10px}
.opennote{color:var(--ink-2);margin:14px 0 0}
.openlist{margin-top:18px;padding:14px;border:2px solid var(--ok);border-radius:16px;background:var(--surface)}
.openlist h2{font-size:20px;margin-bottom:8px}
.tasteask .rows{grid-template-columns:1fr;margin:14px 0}
.tasterow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tasterow .ds{color:var(--ink-3);margin-left:auto;text-align:right}
.tastegrid .qprompt .glyph{vertical-align:-3px}
.gridrow{border:0;padding:0;margin:0 0 16px}
.gridrow legend{font-weight:700;font-size:18px;margin-bottom:8px;padding:0}
.gridchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.gridchips.flavs{display:flex;flex-wrap:wrap}
.gchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:6px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;line-height:1.15;text-align:center}
.gchip .gnum{font-size:16px;color:var(--ink-3)}
.gchip.flav{flex-direction:row;min-height:44px;padding:0 14px;border-radius:22px}
.gchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gchip[aria-pressed="true"] .gnum{color:var(--on-accent)}
.gchip:disabled{opacity:.45}
.notelabel{display:block;font-weight:700;font-size:18px;margin-bottom:6px}
#tasteNote{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:inherit;resize:vertical}
.cmptable{width:100%;border-collapse:collapse;margin:8px 0 14px}
.cmptable th,.cmptable td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.cmptable thead th{color:var(--ink-3);font-size:16px}
.v-match{color:var(--ok);font-weight:700}
.v-close{color:var(--ink-2);font-weight:600}
.v-apart{color:var(--no);font-weight:700}
.flavcmp{margin:0 0 10px}
.copied{color:var(--ok);font-weight:600;white-space:pre-wrap}
@media (max-width:560px){.gridchips{display:flex;flex-wrap:wrap}.gchip{flex:1 1 auto;min-width:60px;min-height:60px;padding:6px 10px}}
.cmptable .nw{white-space:nowrap}

/* ---------- regions map ---------- */
.regionsview .stage{background:var(--sea)}
#geo{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.country{fill:var(--land);stroke:none}
.border{fill:none;stroke:var(--landline);stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.region{cursor:pointer}
.region .hit{fill:transparent}
.region.ours .dot{fill:var(--accent);fill-opacity:.85;stroke:var(--surface);stroke-width:1.5}
.region.other .dot{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.5}
.region.faded .dot{fill-opacity:.25}
.region.sel .dot{stroke:var(--ink);stroke-width:3}
.rlabel{text-anchor:middle;fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;cursor:pointer}
.rlabel.other{fill:var(--ink-2);font-weight:500;font-style:italic}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin path,.pin rect,.pin circle:not(.hit){stroke:var(--surface);stroke-width:1.2}
.pin.approx .g{opacity:.75}
.pin.sel path,.pin.sel rect,.pin.sel circle:not(.hit){stroke:var(--ink);stroke-width:2.5}
.pin.dim{opacity:.25}
.plabel{text-anchor:middle;font-size:14px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3.5px;stroke-linejoin:round;cursor:pointer}
.plabel.sel{font-size:16px;font-weight:700}
.zoomhint{font-weight:600}
.approxnote{color:var(--warn);margin:6px 0 0}
.countries{margin:0 0 10px;color:var(--ink-2)}
.regiondot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
.mappanel .rows{grid-template-columns:1fr}
.where{margin:8px 0 0;color:var(--ink-2)}
.where-label{font-weight:600;color:var(--ink-3);margin-right:4px}
.approx{color:var(--ink-3)}
.maplink{margin-left:8px;font-weight:600;white-space:nowrap}

/* ---------- glossary links ---------- */
/* Wikipedia-style: blue words with a dotted underline (so it is not colour alone). Hover or tap shows the definition. */
.term{display:inline;font:inherit;font-weight:inherit;color:var(--term);background:none;border:0;padding:0;margin:0;cursor:help;
  text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px;text-align:inherit;-webkit-tap-highlight-color:transparent}
.term:hover,.term[aria-expanded="true"]{text-decoration-style:solid}
.nb{white-space:nowrap}
.term[aria-expanded="true"]{background:color-mix(in srgb,var(--term) 14%,transparent);border-radius:3px}
.termpop{position:fixed;z-index:80;max-width:min(340px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-top:3px solid var(--term);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.22);font-size:16px;line-height:1.45}
.termpop[hidden]{display:none}
.tp-term{display:block;font-size:17px;margin-bottom:2px}
.tp-def{display:block;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="toprow">
    <span class="brand">Apricity<span class="b-long"> Wines</span></span>
    <div class="seg" id="modeSwitch" role="group" aria-label="Mode">
      <button type="button" data-mode="learn" aria-pressed="false">Learn</button>
      <button type="button" data-mode="service" aria-pressed="false">Service</button>
    </div>
    <nav id="nav" aria-label="Screens"></nav>
    <div class="status" id="status" aria-live="polite"></div>
    <button type="button" class="btn ghost small" id="themeBtn">Dark</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<script>
// The map fills the screen below the header; keep its height in step with the header's.
(function () {
  var top = document.getElementById("top");
  function set() { document.documentElement.style.setProperty("--top-h", top.offsetHeight + "px"); }
  new ResizeObserver(set).observe(top); set();
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
