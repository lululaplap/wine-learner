// ---------- Take off stock (tablet) ----------
const tk = { step: 0, wine: null, amount: "bottle", reason: null, q: "" };
const REASONS = [["Pairing", "Opened for a pairing"], ["Staff tasting", "Tasted by the team"], ["Breakage", "Dropped or broken"], ["Corked or faulty", "Returned or not served"], ["Comp", "Given to a table"], ["Other", "Add a note"]];
RENDER["take-off"] = () => {
  const steps = `<div class="steps" aria-hidden="true">${[0, 1, 2, 3].map(i => `<span class="${i <= tk.step ? "on" : ""}"></span>`).join("")}</div>`;
  let body = "";
  if (tk.step === 0) {
    body = `<h2 style="font-size:22px;margin-bottom:10px">Who is this?</h2><p class="muted" style="margin-top:0">The tablet stays signed in; each change still records a person.</p>
      <div class="bigchoices">${PEOPLE.map(p => `<button type="button" class="bigchoice" data-who="${p}"><span class="t">${p}</span><span class="s">Floor</span></button>`).join("")}</div>`;
  } else if (tk.step === 1) {
    const glass = WINES.filter(w => w.gl != null).slice(0, 8);
    const hits = tk.q ? findWines(tk.q, 8) : [];
    const card = w => `<button type="button" class="bigchoice" data-pick="${w.id}"><span class="row" style="gap:6px">${glyph(w.t)}<span class="t">${esc(w.s)}</span></span><span class="s num">${esc(w.v)} · ${stockText(w.id)}</span></button>`;
    body = `<h2 style="font-size:22px;margin-bottom:10px">Which wine?</h2>
      <input class="input" id="tkSearch" placeholder="Search: producer, wine, grape or region" value="${esc(tk.q)}" style="max-width:420px;min-height:52px;font-size:18px" aria-label="Search wines">
      ${tk.q ? `<h3 class="lab" style="margin:14px 0 8px">Matches</h3><div class="bigchoices">${hits.map(card).join("") || `<p class="muted">No wine matches.${dymButton(tk.q, "tk")}</p>`}</div>` : `
      <h3 class="lab" style="margin:14px 0 8px">By the glass tonight</h3><div class="bigchoices">${glass.map(card).join("")}</div>`}`;
  } else if (tk.step === 2) {
    const w = byId.get(tk.wine);
    const byGlass = w.gl != null;
    const opts = [["bottle", "A bottle", "750 ml"], ...(byGlass ? [["glass", "A glass", w.gs || "125ml"], ["rest", "The rest of the open bottle", state.open[w.id] ? `${state.open[w.id]} ml left` : "no bottle open"]] : [])];
    body = `<h2 style="font-size:22px;margin-bottom:10px">How much ${esc(w.s)}?</h2><div class="bigchoices">${opts.map(([k, t, s]) => `<button type="button" class="bigchoice" data-amount="${k}" ${k === "rest" && !state.open[w.id] ? "disabled" : ""}><span class="t">${t}</span><span class="s">${s}</span></button>`).join("")}</div>
      ${byGlass ? "" : '<p class="hint" style="margin-top:10px">Not sold by the glass, so stock is counted in whole bottles.</p>'}`;
  } else {
    body = `<h2 style="font-size:22px;margin-bottom:10px">Why?</h2><div class="bigchoices">${REASONS.map(([t, s]) => `<button type="button" class="bigchoice" data-reason="${t}"><span class="t">${t}</span><span class="s">${s}</span></button>`).join("")}</div>
      <div class="field" style="margin-top:12px;max-width:420px"><label for="tkNote">Note (for Other)</label><input class="input" id="tkNote" placeholder="e.g. given to the kitchen for a sauce"></div>`;
  }
  return `<div class="grid cols-2" style="align-items:start">
    <div class="panel">${steps}${body}
      ${tk.step > 0 ? `<p style="margin-top:14px"><button type="button" class="btn ghost" data-back>Back</button>${tk.step > 0 ? ` <span class="muted small">${esc(tk.who || state.who || "")}${tk.wine ? " · " + esc(byId.get(tk.wine).s) : ""}</span>` : ""}</p>` : ""}</div>
    <div class="panel"><h2>Taken off tonight</h2>${(() => { const l = state.moves.filter(m => ["manual", "pairing"].includes(m.kind)).slice(0, 8); return l.length ? `<ul class="ledger">${l.map(ledgerItem).join("")}</ul>` : '<p class="muted">Nothing yet.</p>'; })()}
      <p class="hint">Made a mistake? Undo shows for 10 seconds; after that, the person who made it can undo it until the end of the night, and a manager any time.</p></div>
  </div>
  ${questions(["Is three taps (wine, amount, reason) quick enough mid-service?", "Are these the right reasons? Anything missing (kitchen use, sample for a rep)?", "Should pairing bottles be taken off when opened, or at the end of the night?"])}`;
};
AFTER["take-off"] = () => {
  if (state.who && tk.step === 0) { tk.step = 1; render(); return; }
  const s = document.getElementById("tkSearch");
  if (s) s.addEventListener("input", () => { tk.q = s.value; const p = s.selectionStart; render(); const n = document.getElementById("tkSearch"); n.focus(); n.setSelectionRange(p, p); });
};
function finishTakeOff(reason) {
  const w = byId.get(tk.wine), note = (document.getElementById("tkNote") || {}).value;
  let amt, why = reason + (reason === "Other" && note ? `: ${note}` : "");
  const before = { stock: state.stock[w.id], open: state.open[w.id] };
  if (tk.amount === "bottle") { state.stock[w.id] = Math.max(0, state.stock[w.id] - 1); amt = -1; }
  else if (tk.amount === "glass") { const ml = parseInt(w.gs) || 125; state.open[w.id] = Math.max(0, (state.open[w.id] || 0) - ml); amt = -ml; }
  else { amt = -(state.open[w.id] || 0); state.open[w.id] = 0; }
  const m = record(w.id, reason === "Pairing" ? "pairing" : "manual", amt, why);
  tk.wine = null; tk.q = "";
  // On the shared tablet every change asks who made it; a signed-in sommelier or manager is already known.
  if (isTablet()) { state.who = null; tk.step = 0; } else tk.step = 1;
  const opened = reason === "Staff tasting" && tk.amount === "bottle" && w.gl == null && !state.tasteOpen.has(w.id);
  if (opened) state.tasteOpen.add(w.id);
  render();
  toast(`${esc(w.s)}: ${tk.amount === "bottle" ? "1 bottle" : Math.abs(amt) + " ml"} taken off (${esc(reason)})${opened ? ". Lessons now offer it to taste" : ""}`, () => { state.stock[w.id] = before.stock; state.open[w.id] = before.open; if (opened) state.tasteOpen.delete(w.id); state.moves.splice(state.moves.indexOf(m), 1); });
}

RENDER["add-wine"] = () => { if (ed.mode !== "add") { Object.assign(ed, { mode: "add", wine: null, photo: null, scores: {}, flavours: [], making: [], ls: [], glass: false }); } return editorHTML() + questions(["Is anything missing from adding a wine? Is anything here you would never fill in?", "Would you take the photo on your phone while adding the wine, or add photos later in a batch?", "Should a wine with no notes be allowed on the guest menu?"]); };

function loadForEdit(id) { const w = byId.get(id); Object.assign(ed, { mode: "edit", wine: w, photo: null, scores: w.sc ? Object.fromEntries(Object.entries(w.sc).map(([k, v]) => [k[0].toUpperCase() + k.slice(1), v])) : {}, flavours: (w.fl || []).slice(0, 4), making: (w.mk || []).slice(), ls: w.ls.slice(), glass: w.gl != null }); }
function editorChecks() {
  const v = id => ((document.getElementById(id) || {}).value || "").trim();
  const p = v("fProducer"), c = v("fCuvee"), price = v("fPrice");
  const dup = ed.mode === "add" && p && c && WINES.some(w => w.p.toLowerCase() === p.toLowerCase() && w.c.toLowerCase() === c.toLowerCase());
  const items = [
    [p && c ? "pass" : "fail", p && c ? "Producer and cuvée" : "Add the producer and cuvée"],
    [dup ? "fail" : "pass", dup ? "A wine with this name is already on the list" : "Name is new to the list"],
    [price ? "pass" : "fail", price ? "Bottle price set" : "Add a bottle price"],
    [ed.glass && !v("fGlassPrice") ? "fail" : "pass", ed.glass ? (v("fGlassPrice") ? "Glass price and size set" : "Add the glass price") : "Not sold by the glass"],
    [ed.ls.length ? "pass" : "warnc", ed.ls.length ? `${ed.ls.length} Lightspeed item${ed.ls.length > 1 ? "s" : ""} linked` : "No Lightspeed item: sales won't come off stock"],
    [ed.photo ? "pass" : "warnc", ed.photo ? "Photo added" : "No photo yet (optional)"],
    [v("fNote") || Object.keys(ed.scores).length ? "pass" : "warnc", v("fNote") || Object.keys(ed.scores).length ? "Has notes" : "No notes: shows a Needs notes badge"]
  ];
  const el = document.getElementById("checks");
  if (el) el.innerHTML = items.map(([k, t]) => `<li class="${k}"><span class="i" aria-hidden="true">${k === "pass" ? "✓" : k === "fail" ? "✗" : "!"}</span><span>${t}</span></li>`).join("");
  const pub = document.querySelector("[data-publish]");
  if (pub) pub.disabled = items.some(([k]) => k === "fail");
}
function bindEditor() {
  editorChecks();
  const prod = document.getElementById("fProducer"), pl = document.getElementById("prodList");
  const producers = [...new Set(WINES.map(w => w.p))].sort();
  prod.addEventListener("input", () => {
    const q = prod.value.toLowerCase(); const hits = q ? producers.filter(p => p.toLowerCase().includes(q)).slice(0, 6) : [];
    pl.innerHTML = hits.map(p => `<li><button type="button" data-prod="${esc(p)}">${esc(p)}</button></li>`).join(""); pl.hidden = !hits.length;
  });
  const ls = document.getElementById("fLs"), ll = document.getElementById("lsList");
  ls.addEventListener("input", () => {
    const q = ls.value.toLowerCase(); const all = LS_ITEMS.concat(WINES.flatMap(w => w.ls));
    const hits = q ? all.filter(x => x.toLowerCase().includes(q)).slice(0, 6) : [];
    ll.innerHTML = hits.map(x => `<li><button type="button" data-ls="${esc(x)}">${esc(x)}</button></li>`).join(""); ll.hidden = !hits.length;
  });
  document.getElementById("fGlass").onchange = e => { ed.glass = e.target.checked; keepForm(() => render()); };
  document.getElementById("fPhoto").onchange = e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { ed.photo = r.result; document.getElementById("photoFrame").innerHTML = `<img src="${ed.photo}" alt="Bottle photo preview">`; editorChecks(); };
    r.readAsDataURL(f);
  };
  const pick = document.getElementById("pickWine");
  if (pick) pick.onchange = () => { loadForEdit(pick.value); render(); };
}
// Keeps typed form values across a redraw of the editor.
function keepForm(fn) {
  const vals = {}; document.querySelectorAll(".parts input, .parts select, .parts textarea").forEach(el => { if (el.id && el.type !== "file") vals[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  fn();
  Object.entries(vals).forEach(([id, v]) => { const el = document.getElementById(id); if (el) { if (el.type === "checkbox") el.checked = v; else el.value = v; } });
  editorChecks();
}

const stt = { phase: "count", counts: {} };

    return `<div class="panel"><h2>Review the count</h2><p class="muted">${Object.keys(stt.counts).length} of ${list.length} wines counted. ${diffs.length ? `${diffs.length} differ from what the system expected:` : "Everything counted matches."}</p>
      ${diffs.length ? `<div class="scroll"><table class="table"><thead><tr><th>Wine</th><th class="r">Expected</th><th class="r">Counted</th><th class="r">Difference</th></tr></thead><tbody>${diffs.map(d => `<tr><td>${wineRowCells(byId.get(d.id))}</td><td class="r num">${d.exp}</td><td class="r num">${d.n}</td><td class="r num"><b class="${d.n < d.exp ? "amt neg" : "amt pos"}">${d.n > d.exp ? "+" : ""}${d.n - d.exp}</b></td></tr>`).join("")}</tbody></table></div>` : ""}
      <div class="row" style="margin-top:12px">${canEdit() ? '<button type="button" class="btn big" data-approve>Approve and adjust stock</button>' : '<span class="badge low">Waiting for the sommelier to approve</span>'}<button type="button" class="btn ghost" data-recount>Back to counting</button></div></div>`;
  }

    return `<div class="countrow"><div>${wineRowCells(w)}${n != null ? `<div class="diff ${n === exp ? "amt pos" : "amt neg"}">${n === exp ? "Matches" : `Expected ${exp} (${n > exp ? "+" : ""}${n - exp})`}</div>` : '<div class="hint">Expected number shows once counted</div>'}</div>
      <div class="stepper"><button type="button" data-cnt="${w.id}" data-d="-1" aria-label="One fewer ${esc(w.s)}">−</button><input class="input num cntin" data-cntin="${w.id}" inputmode="numeric" value="${n ?? ""}" placeholder="–" aria-label="Count of ${esc(w.s)}"><button type="button" data-cnt="${w.id}" data-d="1" aria-label="One more ${esc(w.s)}">+</button></div></div>`; };

  ul.innerHTML = hits.length ? hits.map(({ wine: s, why }) => `<li><a href="#/wine/${encodeURIComponent(s.id)}">${Study.glyph(s.type, 16)}<span><span>${esc(s.name)}</span><br><span class="sub">${esc(why || [s.grapes, s.regionGroup].filter(Boolean).join(" · "))}</span></span></a></li>`).join("") : `<li class="sub" style="padding:10px">No wine matches.${dymButton(q, "gq") || " Try a grape, a region or a style."}</li>`;
  ul.hidden = false;
}
document.addEventListener("click", e => { if (e.target.closest("#gres a") || !e.target.closest(".gsearch")) { const ul = document.getElementById("gres"); if (!ul.hidden) { ul.hidden = true; if (e.target.closest("#gres a")) document.getElementById("gq").value = ""; } } });
function studyClick(e, c) {
  const t = e.target;
  if (c.id === "lesson") { if (Study.onLessonClick(e, ctx)) { view.innerHTML = Study.renderLesson(c.arg, ctx); focusQuestion(); } return !t.closest("a"); }
  if (c.id === "path") { Study.onPathClick(e, ctx, () => render()); return !!t.closest("[data-name],[data-switch],[data-reset],[data-clear-new]"); }
  if (c.id === "list") { const b = t.closest("button.chip"); if (!b) return false; Study.toggleType(listState, b); render(); const k = view.querySelector(`button.chip[data-type="${b.dataset.type}"]`) || view.querySelector("button.chip"); if (k) k.focus(); return true; }
  if (c.id === "wine" && t.closest(".card [data-back]")) { if (history.length > 1) history.back(); else go(linkFor(areaHome(state.area))); return true; }
  return false;
}
const go = h => { if (location.hash === h) render(); else location.hash = h; };
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.innerHTML) overlay.innerHTML = "";
  if (cur().id !== "lesson") return; const sel = Study.onLessonKey(e), b = sel && view.querySelector(sel); if (b) { e.preventDefault(); b.click(); } });
addEventListener("hashchange", () => { overlay.innerHTML = ""; render(); scrollTo(0, 0); document.getElementById("main").focus({ preventScroll: true }); });
render();
</script>
