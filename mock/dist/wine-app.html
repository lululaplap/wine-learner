<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body>
<title>Apricity Wine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a back-office app. Sidebar of screens on wide screens, a scrolling tab row on phones; each screen is a working mock with example data. */
:root{
  --bg:#f6f4ef; --surface:#fffefb; --ink:#191d1a; --ink-2:#353b37; --ink-3:#474e49; --line:#cfd3cc; --soft:#ecebe5;
  --accent:#6b1d3c; --on-accent:#ffffff; --warn:#7a3b00; --warn-bg:#fbeedd; --ok:#1d5a33; --ok-bg:#e2f3df; --no:#8e1d1d; --no-bg:#fbe5e3; --term:#0645ad;
  --t-sparkling:#2a6fc4; --t-white:#d99400; --t-red:#d23c3b; --t-sweet:#15936a;
  --sea:#dfe8ec; --land:#f3f1ea; --landline:#b9bfb8;
  --font:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --surface:#1a1e1b; --ink:#eef0ec; --ink-2:#cdd3ce; --ink-3:#b4bcb6; --line:#363f39; --soft:#232824;
  --accent:#f2b3cc; --on-accent:#2a0d19; --warn:#ffc58a; --warn-bg:#3a2a14; --ok:#9be0b3; --ok-bg:#132b1b; --no:#ffb3ad; --no-bg:#361616; --term:#9ec5ff;
  --t-sparkling:#4a93ea; --t-white:#d79a1c; --t-red:#ea5a59; --t-sweet:#28b585; --sea:#0d1418; --land:#262b27; --landline:#4a524c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1a1e1b; --ink:#eef0ec; --ink-2:#cdd3ce; --ink-3:#b4bcb6; --line:#363f39; --soft:#232824;
  --accent:#f2b3cc; --on-accent:#2a0d19; --warn:#ffc58a; --warn-bg:#3a2a14; --ok:#9be0b3; --ok-bg:#132b1b; --no:#ffb3ad; --no-bg:#361616; --term:#9ec5ff;
  --t-sparkling:#4a93ea; --t-white:#d79a1c; --t-red:#ea5a59; --t-sweet:#28b585; --sea:#0d1418; --land:#262b27; --landline:#4a524c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{font-weight:700;font-size:19px;padding:0 8px}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600}
.nav a[aria-current="page"]{background:var(--soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.nav a .count{margin-left:auto;font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:0 7px}
.nav .grp{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 2px}
.main:focus{outline:none}
.main{min-width:0;padding-block:18px 60px;padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.topbar h1{font-size:26px;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:18px;min-height:38px;padding:0 12px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.example{font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:3px 10px}
.mobilenav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobilenav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 14px;padding:0 max(16px, env(safe-area-inset-left, 0px))}
  .mobilenav::-webkit-scrollbar{display:none}
  .mobilenav a{flex:none;min-height:42px;display:flex;align-items:center;padding:0 12px;border-radius:21px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink-2);font-weight:600;font-size:15px}
  .mobilenav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .mbrand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .mbrand b{font-size:18px}
  .topbar .example{display:none}
}
@media (min-width:861px){.mbrand{display:none}}

/* ---------- signing in ---------- */
.account{position:relative;display:flex;align-items:center;gap:10px}
.who{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.who small{color:var(--ink-3);font-size:13px}
.who b{font-size:15px}
.picker{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.2);padding:10px;display:flex;flex-direction:column;gap:6px}
.picker p{margin:2px 6px 6px;font-size:14px;color:var(--ink-3)}
.picker button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:56px}
.picker button b{font-size:16px}
.picker button span{font-size:13px;color:var(--ink-3)}
.picker button:hover{border-color:var(--accent)}
body[data-role="guest"] .app{grid-template-columns:minmax(0,1fr)}
body[data-role="guest"] .side,body[data-role="guest"] .mobilenav{display:none}
.guestpage{max-width:560px;margin:0 auto;background:#f9c6ba;border-radius:20px;color:#111}
.guestnote{max-width:560px;margin:0 auto 12px;color:var(--ink-2);font-size:15px}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel h2{font-size:18px;margin-bottom:10px}
.panel h3{font-size:15px;margin:14px 0 6px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.big{min-height:56px;font-size:18px;border-radius:14px;padding:0 22px}
.btn.danger{background:var(--no);border-color:var(--no);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:9px;padding:1px 8px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.badge.low{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.badge.out{border-color:var(--no);color:var(--no);background:var(--no-bg)}
.badge.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.badge.est{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.glyph{flex:none;vertical-align:-2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-weight:600;font-size:14px;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
textarea.input{min-height:72px;resize:vertical}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.hint{font-size:13px;color:var(--ink-3)}
.questions{margin-top:22px;border:2px dashed var(--line);border-radius:16px;padding:14px 16px;background:transparent}
.questions h2{font-size:16px;margin-bottom:6px}
.questions ul{margin:0;padding-left:20px}
.questions li{margin:4px 0}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.table th{font-size:13px;color:var(--ink-3);font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.table td.r,.table th.r{text-align:right}
.table tr.clickable{cursor:pointer}
.table tr.clickable:hover td{background:var(--soft)}
.scroll{overflow-x:auto;max-width:100%}
.wname{font-weight:600}
.wsub{font-size:13px;color:var(--ink-3)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--ok)}
.bar.low span{background:var(--warn)}
.bar.out span{background:var(--no)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;min-height:38px;padding:0 12px;font-weight:700}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:80;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.18);overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
.drawer .x{position:absolute;right:max(12px, env(safe-area-inset-right, 0px));top:12px;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);font-size:22px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:79}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger .k{font-weight:700;grid-row:span 2}
.ledger .amt{font-weight:700;font-variant-numeric:tabular-nums}
.amt.neg{color:var(--no)} .amt.pos{color:var(--ok)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums}
.statusdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px}
.statusdot.amber{background:var(--warn)}

/* ---------- take off stock (tablet) ---------- */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.steps span.on{background:var(--accent)}
.bigchoices{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.bigchoice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:84px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line)}
.bigchoice:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.bigchoice .t{font-weight:700;font-size:17px}
.bigchoice .s{font-size:14px;color:var(--ink-3)}
.bigchoice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}

/* ---------- editor ---------- */
.parts{display:grid;gap:16px}
.partno{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;margin-right:8px}
.scorechips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scorechips button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;padding:2px}
.scorechips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.photo{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
@media (max-width:500px){.photo{grid-template-columns:1fr}}
.frame34{width:150px;aspect-ratio:3/4;max-width:100%;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--soft);color:var(--ink-3);text-align:center;font-size:13px;padding:6px}
.frame34 img{width:100%;height:100%;object-fit:cover}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:8px;padding:6px 0;font-size:15px}
.checks .i{font-weight:800;width:18px;flex:none}
.checks .pass{color:var(--ok)} .checks .warnc{color:var(--warn)} .checks .fail{color:var(--no)}
.sticky{position:sticky;top:14px}
.typeahead{position:relative}
.typeahead ul{position:absolute;left:0;right:0;top:100%;z-index:20;list-style:none;margin:4px 0 0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:240px;overflow:auto}
.typeahead li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;min-height:40px}
.typeahead li button:hover{background:var(--soft)}

/* ---------- stock take ---------- */
.countrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:26px;font-weight:700;line-height:1}
.stepper .cntin{width:64px;min-height:52px;text-align:center;font-size:22px;font-weight:700}
.diff{font-size:14px;font-weight:700}

/* ---------- menus ---------- */
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:var(--surface);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.locked{font-size:13px;color:var(--ink-3)}
.phone{width:min(390px,100%);margin:0 auto;border:10px solid var(--ink);border-radius:36px;overflow:hidden;background:#f9c6ba;height:680px;display:flex;flex-direction:column}
.phone .scr{overflow:auto;flex:1;color:#111}
/* the guest menu inside the phone keeps the menu site's own colours, in both themes */
.gm{padding:16px;font-family:var(--font)}
.gm h2{font-size:22px;color:#111;margin:0 0 4px;text-align:center}
.gm .gsec{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:#111;border-bottom:1.5px solid #111;padding-bottom:4px;margin:18px 0 6px}
.gm .gw{padding:8px 0;border-bottom:1px solid rgba(0,0,0,.18);display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start}
.gm .gw img,.gm .gw .ph{width:44px;height:58px;border-radius:6px;object-fit:cover;background:rgba(0,0,0,.08);grid-row:span 3}
.gm .gn{font-weight:700;color:#111}
.gm .gd{font-size:14px;color:#3a3a3a}
.gm .gp{font-weight:700;color:#111;text-align:right;white-space:nowrap}
.gm .gnote{grid-column:2 / -1;font-size:14px;color:#3a3a3a;font-style:italic}
.gm .tags{grid-column:2 / -1;display:flex;gap:4px;flex-wrap:wrap}
.gm .tags span{font-size:12px;border:1px solid #3a3a3a;border-radius:8px;padding:0 6px;color:#111}
.gm .so{color:#8e1d1d;font-weight:700;font-size:13px}
.gm .uniq{color:#111}

/* ---------- the study tool's own styles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:44px;padding:0 12px}



.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:120px}
.choice:hover{border-color:var(--ink-3)}
.c-title{font-size:24px;font-weight:700}
.c-sub{color:var(--ink-2)}

/* ---------- badges, chips, rows ---------- */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:2px 10px;color:var(--ink-2);white-space:nowrap}
.badge.estimate{border-color:var(--warn);color:var(--warn);border-style:dashed}
.badge.tasted{border-color:var(--ok);color:var(--ok)}
.badge.needs{border-color:var(--accent);color:var(--accent);border-width:2px}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.glyph{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip b{color:inherit}
.rows{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.winerow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"g m p" "g m b";align-items:center;column-gap:12px;min-height:56px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.winerow:hover{border-color:var(--ink-3)}
.winerow .glyph{grid-area:g}
.wr-main{grid-area:m;display:flex;flex-direction:column;min-width:0}
.wr-name{font-weight:600}
.wr-sub{color:var(--ink-3);font-size:16px}
.wr-price{grid-area:p;font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.wr-badges{grid-area:b;justify-self:end}
.wr-badges .badge{font-size:16px;padding:0 8px}
.listsec{margin-bottom:24px}
.listsearch{margin:0 0 12px}
.listsearch input{width:100%;max-width:520px;min-height:48px;border:1px solid var(--line);border-radius:24px;background:var(--surface);padding:0 18px;font-size:18px}
.found{display:flex;flex-direction:column;gap:2px}
.found .why{margin:0 0 4px 12px;color:var(--ink-2);font-size:16px}
.listsec h2,.checksec h2{font-size:21px;margin:0 0 10px}
.n{color:var(--ink-3);font-weight:500}

/* ---------- wine card ---------- */
.card{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px 24px}
.card .back{margin:0 0 10px}
.card h2{font-size:28px;text-wrap:balance}
.vintage{color:var(--ink-3);font-weight:500}
.card h3{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 6px}
.say{margin:6px 0 0;color:var(--ink-2)}
.meta{color:var(--ink-2);margin:6px 0 0}
.prices{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;margin:8px 0 0}
.unit{font-weight:500;color:var(--ink-3);font-size:16px}
.guestline{font-size:20px;margin:0;max-width:60ch}
.note{margin:0;max-width:62ch}
.tags{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-label{color:var(--ink-3);font-weight:600;margin-right:4px}
.tag{border:1px solid var(--line);border-radius:10px;padding:0 8px}
.scores{display:grid;gap:6px}
.score{display:grid;grid-template-columns:7.5em auto 1fr;gap:10px;align-items:center}
.sc-name{font-weight:600}
.dots{display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3)}
.dot.on{background:var(--ink)}
.sc-word{color:var(--ink-2)}
.cmp{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cmpbtn{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none}
.cmpbtn:hover{border-color:var(--ink-3)}
.cmpbtn > span{display:flex;flex-direction:column}
.nm{font-weight:600;line-height:1.25}
.ds{color:var(--ink-3);font-size:16px;line-height:1.3}
.checkq{border-left:4px solid var(--warn);padding-left:10px;margin:0}
/* ---------- tasting menu pairings ---------- */
.pairingsview{max-width:860px;margin:0 auto}
.pp-jump{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 18px;padding-bottom:2px}
.pp-jump::-webkit-scrollbar{display:none}
.pp-jump .chip{flex:none;text-decoration:none}
.pp-course{margin:0 0 26px;scroll-margin-top:calc(var(--top-h, 120px) + 8px)}
.pp-course h2{font-size:22px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.pp-dishes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.pp-dish{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pp-name{font-size:20px;margin:0 0 8px}
.pp-detail{display:block;font-size:16px;font-weight:500;color:var(--ink-2);margin-top:2px}
.pp-note{margin:0 0 8px;color:var(--ink-2)}
.pp-wine .winerow{background:var(--bg)}
.pp-or{margin:6px 0;color:var(--ink-3);font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.06em}
.pp-missing{color:var(--warn)}
.pairing{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 12px}
.pair-dish{margin:0 0 4px;font-size:18px}
.pair-choose{font-size:15px;color:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:0 6px}
.pair-detail{color:var(--ink-2)}
.pair-note{margin:0 0 6px;color:var(--ink-2)}
.script summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center}
.script p{margin:0 0 8px;max-width:62ch}
.source{margin:20px 0 0;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
.listline{margin:6px 0 0;color:var(--ink-3);font-size:16px}
body[data-mode="service"] .listline{display:none}

/* ---------- data check ---------- */
.checkview{max-width:960px;margin:0 auto}
.viewtitle{font-size:28px;margin-bottom:8px}
.summary{font-size:19px;margin:0 0 8px}
.sources{margin:0 0 20px;padding-left:20px;color:var(--ink-2)}
.checksec{margin:0 0 28px}
.checksec margin:0 0 10px}
.ok{color:var(--ok);font-weight:600;margin:0}
.checkrow{display:flex;flex-direction:column;gap:4px}
.checkrow .key{align-self:flex-start}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:4px 0}
.winelink{font-weight:600}

/* ---------- map ---------- */
.mapview{display:flex;flex-direction:column;height:calc(100dvh - var(--top-h, 120px))}
.mapbar{padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.mapbar .row{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none}
.mapbar .row::-webkit-scrollbar{display:none}
.rowlabel{font-size:16px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.mapbar .seg button{min-height:44px;padding:0 12px}
.key{display:flex;gap:4px}
.key button{display:flex;align-items:center;gap:6px;min-height:44px;border:1px solid transparent;background:transparent;border-radius:14px;padding:0 8px;white-space:nowrap;color:var(--ink-2)}
.key button[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.toggle{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--ink-2);white-space:nowrap;padding:0 8px;border-left:1px solid var(--line)}
.toggle input{accent-color:var(--accent);width:20px;height:20px;margin:0}
.search{position:relative;flex:1;min-width:220px;max-width:340px;margin-left:auto}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:22px;background:var(--bg);padding:0 16px}
.results{position:fixed;z-index:60;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px;display:none;max-height:340px;overflow:auto}
.results.open{display:block}
.results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;min-height:44px}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.results .sub{color:var(--ink-3);font-size:16px}
.results .none{padding:10px;color:var(--ink-2)}
.mapbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.stage{position:relative;min-height:0;overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.maploading{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--ink-2)}
.gcirc{fill:var(--surface);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;cursor:zoom-in}
.glabel{font-weight:700;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;cursor:zoom-in}
.glabel .n{font-weight:500;fill:var(--ink-3)}
.link{stroke:var(--ink-3);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.16;pointer-events:none}
.links.strong .link{opacity:.38}
.links.off .link{opacity:0}
.links.hassel .link{opacity:.04}
.links .link.on{stroke:var(--accent);stroke-width:2;opacity:.95}
.node{cursor:pointer}
.node .hit{fill:transparent}
.node .mark{stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node.t-sparkling .mark{fill:var(--t-sparkling)}
.node.t-white .mark,.node.t-orange .mark{fill:var(--t-white)}
.node.t-red .mark{fill:var(--t-red)}
.node.t-sweet .mark{fill:var(--t-sweet)}
.node.t-rose .mark{fill:var(--surface);stroke:var(--t-red);stroke-width:3}
.node .glassring{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node .nlabel{fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;pointer-events:none;font-weight:600}
.node.dim{opacity:.13}
.node.off{opacity:.05;pointer-events:none}
.node.sel .mark{stroke:var(--ink);stroke-width:3}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.zoomctl button.fit{font-size:16px;font-weight:600}
.legendnote{position:absolute;left:12px;bottom:10px;font-size:16px;color:var(--ink-2);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:3px 8px;border-radius:8px;display:flex;gap:12px;align-items:center;pointer-events:none}
.legendnote span{display:flex;gap:6px;align-items:center}
.mappanel{background:var(--surface);border-top:1px solid var(--line);max-height:44dvh;overflow:auto;padding:12px 16px 16px;position:relative}
.mappanel h2{font-size:22px;margin:0 44px 4px 0;text-wrap:balance}
.mappanel .badges{padding-right:48px}
.mappanel h3{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px}
.mappanel .note{margin:8px 0}
.mappanel .prices{font-size:18px}
.mappanel .intro p{margin:0 0 10px}
.mappanel .foot{color:var(--ink-2)}
.close{position:absolute;right:10px;top:8px;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);font-size:22px;line-height:1}
@media (min-width:900px){
  .mapbody{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}
  .mappanel{border-top:0;border-left:1px solid var(--line);max-height:none;padding:16px 18px 20px}
  .mappanel .cmp{grid-template-columns:1fr}
  .mapbar .row{flex-wrap:wrap;overflow:visible}
}
@media (max-width:899px){
  .mappanel{max-height:38dvh}
  .anchors{display:flex;overflow-x:auto}
  .anchors .cmpbtn{flex:none;width:240px}
}
@media (max-width:560px){
  .rows{grid-template-columns:1fr}
  .card{padding:14px 16px 20px;border-radius:14px}
  .card h2{font-size:24px}
  .search{max-width:none;min-width:180px}
}
/* ---------- lesson path ---------- */
.namepick{max-width:560px;margin:24px auto}
.namepick h1{font-size:28px;margin-bottom:8px}
.namepick .names{margin:12px 0}
.namepick .choice{min-height:64px}
.nameform label{display:block;font-weight:600;margin:8px 0 6px}
.namerow{display:flex;gap:8px}
.namerow input{flex:1;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);font-size:18px}
.pathview{max-width:720px;margin:0 auto;overflow-x:clip;--wind:1}
@media (max-width:560px){.pathview{--wind:.45}}
.pathtop{margin-bottom:20px}
.hello{font-size:22px;font-weight:700;margin:0 0 12px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;min-height:44px;padding:0 6px}
.pathactions{display:flex;flex-wrap:wrap;gap:8px}
.btn.big{min-height:56px;font-size:18px;padding:0 22px;border-radius:16px}
.newlist{margin-top:18px;padding:14px;border:2px solid var(--accent);border-radius:16px;background:var(--surface)}
.newlist h2{font-size:20px}
.unit{margin:0 0 28px}
.unithead{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:start;background:var(--accent);color:var(--on-accent);border-radius:18px;padding:14px 16px}
.uh-n{margin:0;font-weight:600;opacity:.9}
.unithead h2{font-size:22px;margin:2px 0}
.uh-blurb{margin:0;font-size:16px;opacity:.95}
.uh-side{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;font-weight:600;white-space:nowrap}
.crown path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.crown.on path{fill:#f2c14e;stroke:#f2c14e}
.unithead .bar{grid-column:1 / -1}
.bar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .2s}
.unithead .bar{background:color-mix(in srgb,var(--on-accent) 30%,transparent)}
.unithead .bar span{background:var(--on-accent)}
.duebtn{grid-column:1 / -1;justify-self:start;color:var(--on-accent);border-color:color-mix(in srgb,var(--on-accent) 60%,transparent)}
.nodes{list-style:none;margin:44px 0 0;padding:0;display:flex;flex-direction:column;align-items:center;gap:22px}
/* .nodes > .node, not .node: the maps draw each wine as an svg <g class="node"> placed by its transform attribute, which a CSS transform would override */
.nodes > .node{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--off) * var(--wind)));max-width:min(260px,70vw)}
.nodebtn{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--surface);border:3px solid var(--line);
  color:var(--ink-2);font-size:24px;font-weight:700;text-decoration:none;box-shadow:0 5px 0 var(--line)}
.node.next .nodebtn{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);outline:4px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:4px}
.node.done .nodebtn{background:var(--ok);border-color:var(--ok);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.nodebtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.startbubble{position:absolute;top:-34px;background:var(--surface);color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:0 10px;font-weight:700}
.nodewines{margin-top:10px;text-align:center;color:var(--ink-2);font-size:16px;line-height:1.3}
.nodewines .glyph{vertical-align:-2px;margin-right:1px}
.pathfoot{margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.pathfoot p{margin:0}

/* ---------- lesson ---------- */
.lessonview{max-width:760px;margin:0 auto;padding-bottom:280px}
.lessontitle{margin:0 0 8px;color:var(--ink-2);font-weight:600}
.lessontop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.closebtn{display:grid;place-items:center;width:44px;height:44px;border-radius:22px;font-size:28px;color:var(--ink-2);text-decoration:none;flex:none}
.lessonbar{flex:1;height:16px;border-radius:8px}
.lessonbar span{border-radius:8px}
.qtype{display:inline-block;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.qprompt{font-size:26px;line-height:1.25;margin:0 0 20px;outline:none}
.opts{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:68px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);
  font-size:18px;font-weight:600;box-shadow:0 4px 0 var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.optkey{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);color:var(--ink-3);font-size:16px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-bg);box-shadow:0 4px 0 var(--no)}
.opt.faded{opacity:.55}
.opt:disabled{cursor:default}
.saycard{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);margin-bottom:18px}
.say-name{font-size:20px;font-weight:700;margin:0}
.say-meta{margin:4px 0 0;color:var(--ink-2)}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:50;border-top:2px solid;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:rise .18s ease-out}
.feedback.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.feedback.no{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.feedback.say{background:var(--surface);border-color:var(--accent);color:var(--ink)}
.fb-inner{max-width:760px;margin:0 auto}
.fb-head{font-size:24px;font-weight:800;margin:0 0 4px}
.fb-answer{margin:0 0 6px;font-size:18px}
.fb-guest{margin:6px 0;font-size:18px;color:var(--ink)}
.fb-cmp{margin:4px 0;color:var(--ink-2)}
.fb-est{margin:4px 0;color:var(--ink-2);font-size:16px}
.fb-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.feedback.ok .btn{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.feedback.no .btn{background:var(--no);border-color:var(--no);color:var(--surface)}
.feedback.say .btn.ghost{background:transparent;color:var(--ink)}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.lessonend{text-align:center;padding:30px 0}
.lessonend h1{font-size:32px;margin-bottom:10px}
.endscore{font-size:22px}

/* ---------- typed answers and matching ---------- */
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.typedrow{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:0 14px;box-shadow:0 4px 0 var(--line)}
.typedrow:focus-within{border-color:var(--accent)}
.typedrow.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.typedrow.wrong{border-color:var(--no);background:var(--no-bg);box-shadow:0 4px 0 var(--no)}
.pound{font-size:22px;font-weight:700;color:var(--ink-2)}
.typedinput{flex:1;min-width:0;min-height:60px;border:0;background:transparent;font-size:22px;font-weight:600;outline:none}
.typedhelp{color:var(--ink-2);margin:8px 0}
.suggest{list-style:none;margin:6px 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.sugg{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.sugg:hover{border-color:var(--accent)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mbtn{min-height:60px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;box-shadow:0 4px 0 var(--line);text-align:center}
.mbtn.sel{border-color:var(--term);background:color-mix(in srgb,var(--term) 12%,var(--surface));box-shadow:0 4px 0 var(--term)}
.mbtn.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);box-shadow:none;opacity:.75}
.mbtn.miss{border-color:var(--no);background:var(--no-bg);box-shadow:0 4px 0 var(--no)}
.matchgrid.terms .mbtn{font-size:16px;font-weight:500;text-align:left;line-height:1.3}
.matchgrid.terms .mcol:first-child .mbtn{font-weight:700;text-align:center}
.opt.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.opt.pick[aria-pressed="true"] .optkey{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opts.long .opt{font-size:17px;font-weight:500;line-height:1.35}

/* ---------- taste first ---------- */
.openline{margin:10px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.openstate{font-weight:600;color:var(--ink-3)}
.openstate.on{color:var(--ok)}
.openstate.on::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px}
.yourtaste{margin:0;border-left:4px solid var(--term);padding-left:10px}
.opennote{color:var(--ink-2);margin:14px 0 0}
.openlist{margin-top:18px;padding:14px;border:2px solid var(--ok);border-radius:16px;background:var(--surface)}
.openlist h2{font-size:20px;margin-bottom:8px}
.tasteask .rows{grid-template-columns:1fr;margin:14px 0}
.tasterow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tasterow .ds{color:var(--ink-3);margin-left:auto;text-align:right}
.tastegrid .qprompt .glyph{vertical-align:-3px}
.gridrow{border:0;padding:0;margin:0 0 16px}
.gridrow legend{font-weight:700;font-size:18px;margin-bottom:8px;padding:0}
.gridchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.gridchips.flavs{display:flex;flex-wrap:wrap}
.gchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:6px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;line-height:1.15;text-align:center}
.gchip .gnum{font-size:16px;color:var(--ink-3)}
.gchip.flav{flex-direction:row;min-height:44px;padding:0 14px;border-radius:22px}
.gchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gchip[aria-pressed="true"] .gnum{color:var(--on-accent)}
.gchip:disabled{opacity:.45}
.notelabel{display:block;font-weight:700;font-size:18px;margin-bottom:6px}
#tasteNote{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:inherit;resize:vertical}

/* ---------- regions map ---------- */
.regionsview .stage{background:var(--sea)}
#geo{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.country{fill:var(--land);stroke:none}
.border{fill:none;stroke:var(--landline);stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.region{cursor:pointer}
.region .hit{fill:transparent}
.region.ours .dot{fill:var(--accent);fill-opacity:.85;stroke:var(--surface);stroke-width:1.5}
.region.other .dot{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.5}
.region.faded .dot{fill-opacity:.25}
.region.sel .dot{stroke:var(--ink);stroke-width:3}
.rlabel{text-anchor:middle;fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;cursor:pointer}
.rlabel.other{fill:var(--ink-2);font-weight:500;font-style:italic}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin path,.pin rect,.pin circle:not(.hit){stroke:var(--surface);stroke-width:1.2}
.pin.approx .g{opacity:.75}
.pin.sel path,.pin.sel rect,.pin.sel circle:not(.hit){stroke:var(--ink);stroke-width:2.5}
.pin.dim{opacity:.25}
.plabel{text-anchor:middle;font-size:14px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3.5px;stroke-linejoin:round;cursor:pointer}
.plabel.sel{font-size:16px;font-weight:700}
.zoomhint{font-weight:600}
.approxnote{color:var(--warn);margin:6px 0 0}
.countries{margin:0 0 10px;color:var(--ink-2)}
.regiondot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
.mappanel .rows{grid-template-columns:1fr}
.where{margin:8px 0 0;color:var(--ink-2)}
.where-label{font-weight:600;color:var(--ink-3);margin-right:4px}
.approx{color:var(--ink-3)}
.maplink{margin-left:8px;font-weight:600;white-space:nowrap}

/* ---------- glossary links ---------- */
/* Wikipedia-style: blue words with a dotted underline (so it is not colour alone). Hover or tap shows the definition. */
.term{display:inline;font:inherit;font-weight:inherit;color:var(--term);background:none;border:0;padding:0;margin:0;cursor:help;

added to a sparkling wine just before it is corked. It sets how dry the wine tastes: the lower the dosage, the drier.\"\nBrut nature,no added sugar; zero dosage; pas dosé; pas dose,A sparkling wine with no dosage (no sugar added before corking): the driest style there is.\nLees,on the lees; sur lie; lees ageing; lees aging; lees-aged; on its lees,\"The spent yeast left after fermentation. Leaving wine in contact with it adds texture and bready, nutty flavours.\"\nGrower,grower Champagne; growers; récoltant manipulant,\"A Champagne made by the family that farms the vines, rather than by a large house buying grapes. Usually from one village or a few plots, with more character from place and vintage.\"\nCava,,\"Spain's traditional-method sparkling wine, mostly from Catalonia, usually from Macabeo, Parellada and Xarel·lo.\"\nSekt,,\"German for sparkling wine. The best, like this one, are made by the traditional method from Riesling.\"\nCrémant,cremant,\"French traditional-method sparkling wine made outside Champagne, for example in Alsace, the Loire or Burgundy.\"\nNatural,natural wine; natural-wine,\"Wine made with as little added or taken away as possible: farmed organically, fermented with the wild yeast on the grapes, and bottled with little or no added sulfur. Can taste wilder, cloudier or funkier than classic wine.\"\nLow-intervention,low intervention; minimal intervention,Made with as few additions and treatments as possible in the winery. Close in meaning to natural.\nOrganic,organically,\"Grown without synthetic fertilisers, weedkillers or pesticides. In the EU an organic wine must be certified.\"\nBiodynamic,biodynamics; biodynamically,\"Organic farming plus a set of extra practices: herbal and mineral preparations, and timing work by the moon and seasons. The vineyard is run as one living system.\"\nNo added sulfur,no sulfur; sans soufre; zero sulfur; no added sulphur,\"Sulfur dioxide protects wine from oxygen and bacteria. Wines made without adding any taste fresher and more vibrant, but can be less stable, so keep them cool.\"\nLow sulfur,low-sulfur; low sulphur; minimal sulphur; minimal sulfur,\"Made with only a small addition of sulfur dioxide, the usual preservative.\"\nSkin contact,skin-fermented; skin-contact; macerated,\"Leaving the juice of white grapes on their skins, as for red wine. It adds colour (gold to amber), grip and flavours of dried fruit, tea and peel. Long skin contact makes an orange wine.\"\nOrange wine,orange wines; amber wine,\"A white wine made like a red: fermented on its grape skins. Amber in colour, with some tannin and grip. Also called skin-contact or amber wine.\"\nClarete,,A traditional Spanish style made by fermenting white and red grapes together. Sits between a rosé and a light red.\nField blend,,Different grape varieties grown mixed together in one vineyard and picked and fermented together.\nWhole bunch,whole-bunch; whole cluster; whole-cluster,\"Fermenting red grapes with their stems still on. It brings perfume, a spicy, herbal lift and fresher-feeling tannins.\"\nCarbonic maceration,carbonic,\"Fermenting whole, uncrushed red grapes in a tank filled with carbon dioxide. It gives soft, juicy, very fruity wines, as in much Beaujolais.\"\nBarrel-fermented,barrel fermented; barrel-fermentation; barrel ageing; barrel aging; barrel-aged; barrel aged,\"Fermented or aged in oak barrels rather than steel tanks. It adds texture and, from newer barrels, flavours of toast, vanilla and spice.\"\nOak,oaked; oaky; oak-aged; oak aged,\"Wine aged in oak barrels. New oak gives vanilla, toast and spice; old oak mainly adds texture and gentle air contact.\"\nUnoaked,no oak,\"Made and aged without oak, usually in steel or concrete, so the fruit tastes pure and fresh.\"\nAmphora,amphorae; qvevri,\"A clay pot for fermenting or ageing wine, an ancient method. Clay lets in a little air without adding flavour.\"\nConcrete,concrete tanks; concrete eggs,\"Concrete tanks or eggs for fermenting and ageing. Like oak they let the wine breathe slightly, but add no flavour.\"\nCask,casks; large old casks; foudre; foudres,\"A large wooden barrel. Big, old casks add almost no oak flavour; they mainly let the wine age gently.\"\nTopped-up,topped up; ouillé; ouille,\"Jura wine whose barrels are kept full, so no air reaches it. It stays fresh, unlike the nutty, sherry-like wines aged under flor.\"\nOxidative,oxidised; oxidized; oxidative style,\"Deliberately exposed to some air during ageing, giving nutty, bruised-apple and sherry-like flavours and a deeper colour.\"\nFlor,sous voile; under flor,\"A layer of yeast that grows on wine in barrels that are not topped up, as in sherry and Jura's vin jaune. It gives salty, nutty, almond flavours.\"\nSherry-like,sherry,\"Tasting of nuts, bruised apple and salt, like a dry sherry. Comes from flor or from oxidative ageing.\"\nFortified,,\"Wine with grape spirit added, which raises the alcohol and, if added during fermentation, keeps natural sweetness. Port and Maury are fortified.\"\nLate-harvest,late harvest; late-harvest fruit,\"Grapes left on the vine until well after the normal harvest so they shrivel and their sugar concentrates. Makes rich, sweet wines.\"\nAuslese,,\"A German ripeness category: grapes picked late and selected bunch by bunch. Usually sweet, sometimes with noble rot.\"\nSpätlese,spatlese,\"A German ripeness category meaning \"\"late harvest\"\". Riper than standard, from off-dry to sweet.\"\nTrocken,,German for dry.\nTokaj,Tokaji,\"A region of north-east Hungary and south-east Slovakia, famous for sweet wines from Furmint grapes affected by noble rot.\"\nNoble rot,botrytis; Aszú; Aszu; botrytised; botrytized,\"A mould that, in the right misty autumn weather, shrivels ripe grapes and concentrates their sugar and acidity. It gives honey, apricot and marmalade flavours to sweet wines.\"\nOld vines,old vine; old-vine; vieilles vignes; vieille vigne; vinhas velhas,\"Vines decades old (there is no legal minimum age). They give fewer, smaller grapes, often with more concentration.\"\nYoung vines,young-vine; young vine,\"Vines in their first years, which give lighter, fresher wines. Producers often bottle them separately from their top wine.\"\nSingle-vineyard,single vineyard,\"Made from the grapes of one named vineyard, so it shows that site's particular character.\"\nVillage-level,village; village-level wine,\"In Burgundy, wine named after its village (such as Ladoix or Volnay). A step above regional Bourgogne and below premier cru and grand cru.\"\nPremier cru,1er cru,\"\"\"First growth\"\": in Burgundy and Champagne, a vineyard or village officially rated just below grand cru.\"\nGrand cru,,The top official vineyard rating in Burgundy and Champagne.\nAppellation,appellations; AOC; AOP; DOC; DOCG,\"A legally protected wine name tied to a place, with rules on grapes, yields and methods. Sancerre and Chablis are appellations.\"\nVin de France,VDF,\"The simplest French wine category, with no rules on region or grapes. Many natural winemakers use it to work outside appellation rules.\"\nCuvée,cuvee; cuvées,\"A particular blend or bottling from a producer, usually with its own name.\"\nCo-operative,cooperative; co-op,A winery owned jointly by many local growers who bring their grapes to make wine together.\nNégociant,negociant,\"A merchant who buys grapes or wine from growers and makes, bottles and sells it under their own name.\"\nVolcanic,volcanic soil; volcanic soils; volcanic ash,\"Vineyards on soils from old eruptions. Often linked with smoky, salty, mineral-tasting wines with firm acidity.\"\nChalk,chalky; chalk-grown,\"A soft white limestone, the famous soil of Champagne and Sancerre. Chalk-grown wines tend to be fine, fresh and lean.\"\nSlate,,\"A dark, flaky rock, as on the steep Mosel slopes. Slate-grown Riesling is often described as stony and smoky.\"\nGranite,,\"A hard, crumbly rock that drains well, as in the best Beaujolais villages. Granite-grown wines are often fresh and perfumed.\"\nLimestone,,\"A rock rich in calcium, as in Burgundy. Associated with tense, mineral, long-lived wines.\"\nMineral,minerality,\"A tasting word for flavours that are not fruit: wet stone, chalk, flint, salt. Usually goes with high acidity and a lean style.\"\nStruck-match,struck match; flinty; flint,\"A smoky, flinty smell from the winemaking (a little sulfur reduction), prized in some top Chardonnay and Champagne.\"\nPetrol,,\"A smell like kerosene that develops in aged Riesling. Prized by Riesling lovers; some guests find it odd, so mention it.\"\nVinous,,\"Tasting like still wine: for a sparkling wine, rich and full-flavoured rather than light and fizzy.\"\nGrip,,The slight drying or rough feel on the gums and tongue from tannin. Gentle grip is pleasant; strong grip needs food.\nTannin,tannins; tannic,\"Compounds from grape skins, seeds, stems and oak that dry the mouth, like strong tea. Mostly in red and orange wines. Scored 1 to 5 on the card.\"\nAcidity,acid,The freshness or sharpness of a wine: it makes your mouth water. High-acid wines taste crisp and lively. Scored 1 to 5 on the card.\nBody,full-bodied; light-bodied; medium-bodied,\"How heavy a wine feels in the mouth, from light like skimmed milk to full like cream. Alcohol, sugar and extract all add body. Scored 1 to 5 on the card.\"\nSweetness,off-dry,\"How much sugar you can taste, from dry (none) to luscious. Off-dry means a hint of sweetness. Scored 1 to 5 on the card.\"\nWildness,,\"This tool's score for natural-wine character: from clean and classic (1) to divisive (5), with cloudiness, funk or volatility. Warn guests about anything at 4 or 5.\"\nSavoury,savory,\"Flavours that are not fruit or sweet: herbs, meat, earth, mushroom, salt.\"\nLean,,\"Light and high in acidity, with little fat or richness. Not a fault: think Chablis or Muscadet.\"\nTexture,textured; texture-driven,\"How a wine feels rather than tastes: smooth, waxy, creamy, grippy. Lees, skin contact and oak all add texture.\"\nStructured,structure,Having firm tannin and acidity that frame the fruit. Structured wines usually need food or time.\nLength,long finish; finish,How long the flavour lasts after you swallow. Long length is a sign of quality.\nCo-fermentation,co-fermented,Different grapes fermented together rather than blended afterwards.\nDemijohn,demijohns,\"A large glass vessel for ageing wine, often left outdoors in the sun, as for Maury.\"\nGarrigue,,\"The wild herbs and scrub of the Mediterranean south of France (thyme, rosemary, bay); used for herbal, savoury aromas.\"\nGobelet,bush vine; bush-trained,\"A traditional free-standing, bush-trained vine, with no wires.\"\nHybrid grapes,hybrid; hybrids,\"Crossings of vine varieties bred to resist disease and heat, such as Donauriesling or Muscaris.\"\nMaceration,macerations; maceration time,\"Soaking grape skins in the juice or wine for colour, flavour and texture.\"\nMoelleux,,French for a gently sweet wine.\nNative yeast,native yeasts; wild yeast; wild yeasts; native-yeast; indigenous yeast,\"Fermentation by the yeasts naturally present in the vineyard and cellar, rather than added ones.\"\nReasoned viticulture,lutte raisonnée,\"Low-chemical, eco-minded farming, short of organic certification.\"\nRegenerative farming,regenerative; regeneratively,Farming focused on restoring soil health and biodiversity.\nRescued wine,rescued surplus wine; surplus wine,\"Surplus wine saved from going to waste and made into something new, as for our Riesling+ with the Wasted Wine Club.\"\nRimage,,\"A young, vintage-dated Banyuls, bottled early to keep its fruit and freshness.\"\nSolera,,\"A fractional ageing system that blends older and younger wine, as for sherry.\"\nSustainable,sustainable farming; sustainably,\"Farming with lower chemical use and an eye on the environment, without organic rules.\"\nTerroir,,\"The soil, climate and landscape that shape a wine's character.\"\nUnfiltered,unfined; unfined and unfiltered; minimal filtration,\"Not filtered or fined (clarified) before bottling; can be hazy, with more texture.\"\nVin de voile,voile; under a veil,\"A wine aged under a veil of flor yeast without topping up the barrel, giving nutty, saline flavours.\"\n", "regions": "Region,Country,Latitude,Longitude,Also matches,Misspellings,Known for,Grapes\nChampagne,France,49.05,4.00,Cumières; Avize; Aÿ; Ay,Shampain; Shampane; Shampagne,\"Cool, chalky hills east of Paris; the home of traditional-method sparkling wine, from big houses and small growers.\",\"Chardonnay, Pinot Noir, Pinot Meunier\"\nAlsace,France,48.20,7.35,,,\"A dry, sunny strip under the Vosges mountains on the German border, known for aromatic whites labelled by grape.\",\"Riesling, Gewurztraminer, Pinot Gris, Pinot Blanc, Sylvaner\"\nBurgundy,France,47.00,4.80,Bourgogne; Chablis; Mâcon; Macon; Mâconnais; Côte d'Or; Cote d'Or; Côte de Beaune; Côte de Nuits; Pouilly-Fuissé,Shablee; Shably; Shabli,\"The benchmark for Pinot Noir and Chardonnay, sold by village and single vineyard, from Chablis in the north to the Mâconnais.\",\"Pinot Noir, Chardonnay, Aligoté\"\nBeaujolais,France,46.10,4.60,Chénas; Morgon; Fleurie; Moulin-à-Vent,Bojolais; Bojolai; Bojolay,\"Granite hills south of Burgundy making juicy, perfumed Gamay; the ten village crus such as Chénas and Morgon are the serious end.\",Gamay\nJura,France,46.75,5.60,Arbois; Côtes du Jura,,\"A small, cool region near Switzerland, famous for nutty, oxidative whites like vin jaune and for fresh, natural-leaning reds and whites.\",\"Savagnin, Chardonnay, Poulsard, Trousseau, Pinot Noir\"\nSavoie,France,45.55,6.00,,,\"Alpine vineyards on steep slopes making light, fresh mountain whites and crunchy reds.\",\"Jacquère, Altesse, Mondeuse, Gamay\"\nLoire,France,47.30,0.70,Loire Valley; Sancerre; Pouilly-Fumé; Muscadet; Vouvray; Chinon; Saumur; Anjou; Touraine; Savennières,Sansair; Sanser,\"France's longest river: Muscadet near the sea, Chenin in Anjou and Vouvray, Cabernet Franc in Chinon and Saumur, Sauv  Grigio\nIf you like,Chablis\nIf you like,White Burgundy\nIf you like,Oaked Chardonnay\nIf you like,Albariño\nIf you like,Riesling\nIf you like,Grüner Veltliner\nIf you like,Provence rosé\nIf you like,Beaujolais\nIf you like,Pinot Noir\nIf you like,Côtes du Rhône\nIf you like,Rioja\nIf you like,Chianti\nIf you like,Barolo\nIf you like,Bordeaux\nIf you like,Malbec\nIf you like,Shiraz\nIf you like,Port\nIf you like,Sauternes\nIf you like,Sherry\nIf you like,Jura\n", "pairings": "Order,Course,Choose one,Dish,Dish detail,Wine,Status,Note,Script\n1,Starter 1,yes,Ox terrine,,mas foulaquier loiseau,On,Same wine as the carrot.,\"Mas Foulaquier sits at the northern edge of Pic Saint-Loup, in the Languedoc, on a striking terroir of limestone scree over red clay. Swiss transplant Pierre Jéquier and his wife Blandine Chauchat have farmed the estate biodynamically since the early 2000s, working with old vines and native yeasts and keeping intervention to a minimum. L'Oiseau Blanc blends five Mediterranean white grapes (Grenache Blanc, Grenache Gris, Bourboulenc, Rolle and Clairette), aged in wood and sandstone amphora. The result is textured and aromatic, moving between citrus, orchard fruit and a savoury touch of garrigue herbs, with a fresh, mineral finish that pairs beautifully with the richness of the ox terrine and the sweetness of the carrot.\"\n1,Starter 1,yes,Carrot,,mas foulaquier loiseau,On,Same wine as the ox terrine.,\"Mas Foulaquier sits at the northern edge of Pic Saint-Loup, in the Languedoc, on a striking terroir of limestone scree over red clay. Swiss transplant Pierre Jéquier and his wife Blandine Chauchat have farmed the estate biodynamically since the early 2000s, working with old vines and native yeasts and keeping intervention to a minimum. L'Oiseau Blanc blends five Mediterranean white grapes (Grenache Blanc, Grenache Gris, Bourboulenc, Rolle and Clairette), aged in wood and sandstone amphora. The result is textured and aromatic, moving between citrus, orchard fruit and a savoury touch of garrigue herbs, with a fresh, mineral finish that pairs beautifully with the richness of the ox terrine and the sweetness of the carrot.\"\n2,Starter 2,yes,Trout,,apricity wasted wine club riesling,On,,\"A very fresh Riesling from the Mosel in Germany, a region renowned for this variety. Bright apple and citrus wrapped in floral aromas, with macerated hybrids adding body, texture and a little grip.\"\n2,Starter 2,yes,Scallop,,du grappin maconvillages,On,,\"Du Grappin is made by Andrew and Emma Nielsen of Le Grappin, an Australian couple who set up shop in Beaune and became cult favourites for wines of real precision. This Mâcon-Villages comes from old-vine Chardonnay on the cool, limestone-rich slopes above Azé. It's fermented with native yeasts and aged on its lees in old barrels, so you get a creamy, textured palate of ripe peach and white blossom, but the acidity keeps it fresh and lemony on the finish. That mix of richness and tension is what makes it so good with scallops: it matches their natural sweetness and cuts through the butter.\"\n2,Starter 2,yes,Mushroom,\"Mushrooms, Jerusalem artichoke, koji\",roc des anges alquimia,On,,\"Alquimia comes from Marjorie and Stéphane Gallet in Roussillon, who farm biodynamically on steep schist hillsides. It's a vin de voile, a white aged oxidatively, so think of the nutty, savoury side of Jura wine or a fino sherry, but from Macabeu and Grenache Gris. It's dry and complex, with roasted nut, dried apricot and a saline, slatey freshness underneath. That nuttiness picks up the sweet earthiness of the Jerusalem artichoke, and the wine's savoury depth matches the umami of the mushrooms and koji, while the acidity keeps the dish from feeling heavy.\"\n3,Middle course,,Lettuce,,davenport horsmonden,On,,\"Think Sauvignon Blanc without the gooseberry. Lees ageing gives some texture, but it stays very fresh, grassy and floral. Clean and bright without being harshly acidic, so it sits beautifully with fresh lettuce.\"\n3,Middle course,,Squash,\"Tempura and pickled squash, with ricotta, mixed herbs and chilli crisp\",radikon pop bianco,On,,\"Pop Bianco comes from the legendary Radikon family estate in Oslavje, right on the border with Slovenia. As an orange wine, the white varieties spend time fermenting on their skins, imparting a delicate tannic grip alongside notes of dried apricot, orange peel and herbal tea. While traditional Radikon cuvées undergo extensive maceration, this bottling sees a gentler touch, keeping it vibrant, juicy and infinitely fresh. That subtle skin-contact structure slices cleanly through the crunchy tempura and smooth ricotta, while its bright, zesty acidity echoes the pickled squash and holds its own against the lingering heat of the chilli.\"\n4,Main,yes,Pollack,\"Pollack with sardine emulsion, borlotti beans and tomato\",gili villo,On,,\"Villo comes from Agricola Gili, an exciting young venture on the southwestern shore of Sicily launched by Ermanno Vella and Alice Marconcini. Farming near the seaside village of Torretta Granitola, their 30-year-old Grillo vines sit barely a kilometre from the water on red clay and sand over limestone. Half the harvest undergoes a week of skin contact before blending with direct-pressed juice, followed by seven months of maturation in neutral oak. It brings a bright, saline lift driven by citrus, white peach and Mediterranean herbs, balanced by a gentle textural grip. That coastal character is ideal for the pollack: its racy minerality cuts through the dish, while the subtle skin-contact structure harmonises with the rich sardine emulsion and creamy borlotti beans, leaving the tomato to highlight the wine's vibrant, sun-ripened freshness.\"\n4,Main,yes,Venison,,montanetthoden garance,On,,\"Garance comes from Domaine Montanet-Thoden, the same Vézelay family estate behind our Galerne. Valentin Montanet farms organically, and most of the Pinot Noir vines face south, which gives this cool-climate red generous ripeness. It's medium-bodied and high-toned, with juicy red fruit, a touch of spice and silky tannins. Its fresh, Pinot-driven acidity keeps it lifted, which suits the richness and gamey depth of the venison without overpowering it.\"\n4,Main,yes,Beetroot,,matthieu cosse fronsac,On,,\"Bordeaux can be very big and heavy, but Matthieu Cosse farms with respect for the land and picks earlier, so the wine keeps its freshness and acidity. It's bold and spicy, with rich dark fruit and a touch of wild strawberry. Tannins this strong could be hard going, but the sweet, earthy depth of the beetroot softens them and brings out the dark fruit rather than the green, eucalyptus edge of the Cabernet Sauvignon.\"\n5,Cheese,,Cheese,,mas amiel maury vintage,On,\"Serve the Maury or the Banyuls, whichever is on; the same wine goes with the mousse.\",\"A sweet, fortified Grenache aged outdoors in glass demijohns: rich, silky and complex.\"\n5,Cheese,,Cheese,,domaine du traginier banyuls rimage,On,\"Serve the Maury or the Banyuls, whichever is on; the same wine goes with the mousse.\",\"Banyuls Rimage comes from very steep slopes close to the coast, where the sea influence helps preserve freshness. In a warm climate, sugar in the grapes rises quickly while acidity drops, so that coastal freshness matters. Lovely tannin structure and not overly sweet. A family-run estate working everything by hand and with horses.\"\n6,Dessert,yes,Mousse,,mas amiel maury vintage,On,\"The same wine as the cheese course: the Maury or the Banyuls, whichever is on.\",\"A sweet, fortified Grenache aged outdoors in glass demijohns: rich, silky and complex.\"\n6,Dessert,yes,Mousse,,domaine du traginier banyuls rimage,On,\"The same wine as the cheese course: the Maury or the Banyuls, whichever is on.\",\"Banyuls Rimage comes from very steep slopes close to the coast, where the sea influence helps preserve freshness. In a warm climate, sugar in the grapes rises quickly while acidity drops, so that coastal freshness matters. Lovely tannin structure and not overly sweet. A family-run estate working everything by hand and with horses.\"\n6,Dessert,yes,Panna cotta,\"Basil panna cotta, apple, sesame\",melsheimer spatlese,On,,\"This is a Riesling Spätlese from Thorsten Melsheimer, who farms organically and biodynamically on the Mullay-Hofberg, a very steep slate hillside above the Mosel. It's a late-harvest wine with a gentle sweetness, but the acidity is bright and the finish stays clean and slatey. The sweetness suits the panna cotta, and the acidity cuts through the cream. The apple in the wine echoes the apple on the plate, and the basil brings out its herbal, citrusy side. Together with the toasted sesame, it makes the whole dish feel light.\"\n6,Dessert,yes,Treacle pudding,,szolo dolce,On,,\"A beautifully balanced sweet Tokaj that invites another sip with every taste. This multi-vintage cuvée combines the depth and nobility of Aszú with the brightness of late-harvest fruit, resulting in a wine that is indulgent yet remarkably light on its feet. The nose is expressive and layered, opening with candied orange peel, peach compote and baked pear, followed by acacia honey, vanilla, cinnamon and a touch of saffron. On the palate, lush sweetness is countered by vibrant natural acidity, giving precision and lift to the rich core. Apricot, quince and citrus marmalade unfold over a fine mineral backbone, leading to a long, silky finish marked by gentle botrytis spice and freshness. A modern, elegant expression of sweet Tokaj: generous, harmonious and dangerously drinkable.\"\n,Retired,,Hogget,,ferdinando principiano langhe nebbiolo,Retired,,\"Langhe Nebbiolo is often called a poor man's Barolo, but the style is quite different. It shows Nebbiolo's more feminine side, with lighter texture, softer tannins from shorter macerations and, above all, the variety's delightful aromas of flowers and red fruits. Principiano's wines are all about freshness and subtlety, and the value for money is top. Ferdinando Principiano is on the southern fringe of the Barolo zone and benefits from the biodiversity of the Alta Langhe wilderness beyond the dense Nebbiolo plantings, which helps keep the vineyard in balance. In 2003 he moved away from conventional production and has been rewarded with purity and drinkability. He uses wild yeast fermentation and organic methods, and minimises sulphur.\"\n,Retired,,Agnolotti,Agnolotti with leek velouté,atelier kramar primario,Retired,\"Primario, Atelier Kramar 2022: steep hillsides, an 800-year-old grape, a small family winery run by an artist couple.\",\"A historically significant grape, with over 800 years of orange-wine tradition in the region. The grape juice is quite low in flavour compared with the skins, so macerating the skins gives a wine with much more flavour. Textural and fresh, and a great pairing for rich agnolotti thanks to the tannin from skin contact. The leek velouté works well too: the richness has a nice backbone from the body of the wine and the tannins.\"\n,Retired,,Strawberry,,larchetipo moscatello selvatico,Retired,,\"An almost-forgotten, darker-skinned Muscat sub-variety, made here into an off-dry sparkling wonder. L'Archetipo works with ancient grains as well as wine, with sustainability at its core.\"\n"};

<script>
// ======================================================================
// Example data. Wines, prices and notes are the real list; stock, sales,

// ======================================================================
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (n == null ? "" : "£" + n);
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; };
const TYPES = ["sparkling", "white", "rose", "orange", "red", "sweet"];
const TYPE_LABEL = { sparkling: "Sparkling", white: "White", rose: "Rosé", orange: "Orange", red: "Red", sweet: "Sweet" };
function glyph(type, size = 16) {
  const h = size / 2, r = size * 0.36, col = { sparkling: "var(--t-sparkling)", sweet: "var(--t-sweet)", red: "var(--t-red)", rose: "var(--t-red)", white: "var(--t-white)", orange: "var(--t-white)" }[type];
  let s;
  if (type === "sparkling") s = `<path d="M0 ${-r * 1.25}L${r * 1.05} 0L0 ${r * 1.25}L${-r * 1.05} 0Z" fill="${col}"/>`;
  else if (type === "orange") s = `<rect x="${-r * .9}" y="${-r * .9}" width="${r * 1.8}" height="${r * 1.8}" fill="${col}"/>`;

  else if (type === "rose") s = `<circle r="${r * .8}" fill="none" stroke="${col}" stroke-width="${Math.max(2, size * .13)}"/>`;
  else s = `<circle r="${r}" fill="${col}"/>`;
  return `<svg class="glyph" width="${size}" height="${size}" viewBox="${-h} ${-h} ${size} ${size}" aria-hidden="true">${s}</svg>`;
}

const PEOPLE = ["Sam", "Ana", "Kai", "Jo", "Priya"]; // example names
const SUPPLIERS = [
  { name: "Les Caves", lead: 3, email: "orders@example-caves.co.uk" },
  { name: "Tutto Wines", lead: 4, email: "orders@example-tutto.co.uk" },
  { name: "Modal Wines", lead: 5, email: "orders@example-modal.co.uk" },
  { name: "Gergovie", lead: 7, email: "orders@example-gergovie.co.uk" },
  { name: "Wasted Wine Club", lead: 2, email: "hello@example-wasted.co.uk" }
];
const BOTTLE = 750;
const NOW = new Date("2026-11-16T18:30:00");

const state = {
  role: "guest",   // signed out: the public guest menu

  who: null
};
WINES.forEach(w => {
  const h = hash(w.id), h2 = hash(w.id + "x"), h3 = hash(w.id + "y");
  const glass = w.gl != null;
  const use = glass ? 1.2 + h * 2.2 : (w.b > 200 ? 0.1 + h * 0.4 : 0.2 + h * 1.4);
  let n = Math.round(glass ? 10 + h2 * 20 : (w.b > 200 ? 2 + h2 * 5 : 3 + h2 * 15));
  if (h3 < 0.05) n = Math.min(n, 1);
  state.stock[w.id] = n;
  if (glass) state.open[w.id] = Math.round(100 + h2 * 500);
  state.use[w.id] = Math.round(use * 10) / 10;
  w.supplier = SUPPLIERS[Math.floor(h3 * SUPPLIERS.length)].name;
  w.cost = Math.round((w.b || w.gl * 5) * (0.28 + h * 0.06));

});
// a few headline examples so the mock tells a story
[["matthieu-cosse-fronsac", 3, 3.4], ["pranzegg-rosso-per-tutti", 3, 4.1], ["mas-du-libian-bout-dzan", 18, 4.2], ["guillaume-selosse-largillier", 1, 0.2],
 ["domaine-henri-bourgeois-sancerre-la-vigne-blanche", 3, 2.6], ["radikon-pop-bianco", 1, 2.3]]

// example movement history
(function seedMoves() {

  const ids = ["mas-du-libian-bout-dzan", "matthieu-cosse-fronsac", "pranzegg-rosso-per-tutti", "mas-foulaquier-loiseau", "radikon-pop-bianco", "roebuck-estates-classic-cuvee", "domaine-henri-bourgeois-sancerre-la-vigne-blanche"].filter(id => byId.has(id));

(function seedInbox() {
  const base = sw(TASTE_EXAMPLE).scores, nudge = (s, k, d) => Object.assign({}, s, { [k]: Math.max(1, Math.min(5, s[k] + d)) });
  state.inbox.push(
    { id: TASTE_EXAMPLE, who: "Kai", at: new Date(NOW - 70 * 60000), scores: nudge(nudge(base, "oak", -1), "body", 0), flavours: ["lemon", "salt", "herbs"], note: "Less oak than I expected. Very salty finish." },
    { id: TASTE_EXAMPLE, who: "Jo", at: new Date(NOW - 64 * 60000), scores: nudge(base, "oak", -1), flavours: ["lemon", "smoke", "flint"], note: "" },
    { id: TASTE_EXAMPLE, who: "Ana", at: new Date(NOW - 61 * 60000), scores: nudge(base, "acidity", 1), flavours: ["lemon", "grapefruit", "salt"], note: "Sharper than the note says." });
})();

// Example learning progress for the team, so the path and the team overview have something to show.
(function seedProgress() {
  const S = Study.store, VERSION = 6;
  if (S.get("mockseed", 0) === VERSION) return;
  const order = Study.buildStages(ctx.data.wines).flatMap(s => s.lessons).flatMap(l => l.wines);
  const sig = w => [w.vintage, w.bottle, w.glass].join("|");
  const sigs = Object.fromEntries(ctx.data.wines.map(w => [w.id, sig(w)]));
  const now = Date.now(), DAY = 864e5;
  const plan = { Sam: 18, Ana: 46, Kai: 26, Jo: 8, Priya: 62, Sommelier: 136, Manager: 30, Robin: 120 };
  Object.entries(plan).forEach(([name, n]) => {
    const p = Study.emptyProgress();
    order.filter(w => w.id !== NEW_EXAMPLE).slice(0, n).forEach((w, i) => {
      const h = hash(name + w.id);
      const box = name === "Sommelier" ? 5 : i < n * 0.6 ? 4 + (h > 0.6 ? 1 : 0) : 1 + Math.floor(h * 3);
      p.wines[w.id] = { box, due: now + (h < 0.15 ? -DAY : (box * 2 + 1) * DAY), seen: box + 1, right: box, wrong: h < 0.3 ? 1 : 0, last: now - Math.floor(h * 6) * DAY };
    });

    S.set("progress:" + name, p);
  });

// guest's style (If you like) finds wines too, with the reason shown.
let finder = null;
const finderIdx = () => (finder && finder.n === ctx.data.wines.length ? finder.idx : (finder = { n: ctx.data.wines.length, idx: Study.searchIndex(ctx.data.wines, ctx.regions) }).idx);
const findHits = (q, n = 8) => Study.search(finderIdx(), q, { limit: n }).map(x => ({ w: byId.get(x.wine.id) || state.added.find(a => a.id === x.wine.id), why: x.why })).filter(x => x.w);
const findWines = (q, n = 8) => findHits(q, n).map(x => x.w);
// "Did you mean “chardonnay”?" when a search finds nothing; data-dym-for names which box it fills.
const dymButton = (q, box) => { const d = Study.didYouMean(finderIdx(), q); return d ? ` <button type="button" class="linkbtn" data-dym="${esc(d)}" data-dym-for="${esc(box)}">Did you mean “${esc(d)}”?</button>` : ""; };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-dym-for]"); if (!b) return;
  const box = b.dataset.dymFor, q = b.dataset.dym;
  if (box === "gq") { const el = document.getElementById("gq"); el.value = q; searchWines(q); el.focus(); }
  else if (box === "tk") { tk.q = q; render(); const el = document.getElementById("tkSearch"); if (el) { el.focus(); el.setSelectionRange(q.length, q.length); } }
  else if (picks[box]) { picks[box].q = q; const el = view.querySelector(`[data-wpick-q="${box}"]`); if (el) { el.value = q; el.focus(); } document.getElementById("wpl-" + box).innerHTML = wpickItems(box); }
});
const picks = {}; // picker id -> { q, open, onPick, suggest, none }
function winePicker(id, { value = null, onPick, label = "Wine", suggest = [], q = "", disabled = false, none = "", keepOpen = false } = {}) {
  const p = picks[id] = picks[id] || { q, open: !value };
  Object.assign(p, { onPick, suggest, none, keepOpen });
  const w = value && (byId.get(value) || state.added.find(x => x.id === value));
  if (w && !p.open) return `<div class="wpick chosen">${glyph(w.t)}<span class="wpick-name"><b>${esc(w.s)}</b> <span class="muted num">${esc(w.v)}</span><span class="wsub">${esc(w.p)} · ${esc(w.sec)}</span></span>
    ${disabled ? "" : `<button type="button" class="btn ghost" data-wpick-change="${id}" aria-label="Change ${esc(label)}">Change</button>`}</div>`;
  return `<div class="wpick"><input class="input" type="search" data-wpick-q="${id}" value="${esc(p.q)}" placeholder="Search: producer, wine, grape or region" aria-label="${esc(label)}: type to search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="wpl-${id}" aria-expanded="true">
    <ul class="wpick-list" id="wpl-${id}" role="listbox" aria-label="Matching wines">${wpickItems(id)}</ul></div>`;
}
function wpickItems(id) {
  const p = picks[id], typed = p.q.trim();
  const found = typed ? findHits(p.q) : p.suggest.map(x => ({ w: byId.get(x) || state.added.find(a => a.id === x) })).filter(x => x.w).slice(0, 6);
  const hits = found.map(x => x.w), why = new Map(found.map(x => [x.w.id, x.why]));
  if (!hits.length) return typed ? `<li class="wpick-none">No wine matches “${esc(typed)}”.${dymButton(typed, id) || (p.none ? " " + p.none : "")}</li>` : "";
  return (typed ? "" : '<li class="wpick-head">Suggested</li>') + hits.map(w => `<li role="option" aria-selected="false"><button type="button" data-wpick-opt="${id}" data-id="${w.id}">${glyph(w.t)}<span><b>${esc(w.s)}</b> <span class="muted num">${esc(w.v)}</span><span class="wsub">${esc(w.p)} · ${esc(w.sec)} · ${stockText(w.id)}</span>${why.get(w.id) ? `<span class="wsub why">${esc(why.get(w.id))}</span>` : ""}</span></button></li>`).join("");
}
function choosePick(id, wineId) {
  const p = picks[id];
  p.q = ""; p.open = !!p.keepOpen;
  if (p.onPick) p.onPick(wineId);
  if (p.keepOpen) { const n = view.querySelector(`[data-wpick-q="${id}"]`); if (n) n.focus(); }
}
document.addEventListener("input", e => {
  const inp = e.target.closest("[data-wpick-q]"); if (!inp) return;
  const id = inp.dataset.wpickQ; picks[id].q = inp.value;
  document.getElementById("wpl-" + id).innerHTML = wpickItems(id);
});
document.addEventListener("click", e => {
  const opt = e.target.closest("[data-wpick-opt]"); if (opt) { choosePick(opt.dataset.wpickOpt, opt.dataset.id); return; }
  const ch = e.target.closest("[data-wpick-change]");
  if (ch) { const id = ch.dataset.wpickChange; picks[id].open = true; picks[id].reopened = true; render(); const n = view.querySelector(`[data-wpick-q="${id}"]`); if (n) n.focus(); }
});
// Keys: Enter takes the first match; the arrows move through the matches; Escape keeps the wine already chosen.
document.addEventListener("keydown", e => {
  const inp = e.target.closest("[data-wpick-q]"), opt = e.target.closest("[data-wpick-opt]");
  const id = inp ? inp.dataset.wpickQ : opt ? opt.dataset.wpickOpt : null; if (!id) return;
  const opts = [...document.querySelectorAll(`#wpl-${id} [data-wpick-opt]`)], i = opts.indexOf(e.target);
  if (e.key === "Enter" && inp) { e.preventDefault(); if (opts[0]) opts[0].click(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); (opts[i + 1] || opts[0] || {}).focus?.(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); if (i > 0) opts[i - 1].focus(); else if (inp || i === 0) view.querySelector(`[data-wpick-q="${id}"]`).focus(); }
  else if (e.key === "Escape" && picks[id].reopened) { picks[id].open = false; picks[id].reopened = false; picks[id].q = ""; render(); }
});

function ledgerItem(m) {
